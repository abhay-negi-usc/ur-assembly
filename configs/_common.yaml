# Shared hardware definition, INCLUDED by reference in the notes below (yaml has no real include,
# so each config repeats the robot/camera/hand_eye/gripper blocks -- they are collected here as the
# canonical source to copy from). Values carried over verbatim from the ROS stack.

# ---- Robot (RTDE) ----
robot:
  ip: 192.168.125.2
  dry_run: false                 # --dry-run overrides; plans every move without a robot
  # Tool payload (gripper + coupler + camera): mass + CoG in the tool0 frame (m). REQUIRED so
  # getActualTCPForce() subtracts the tool weight and reports true EXTERNAL force.
  payload:
    mass_kg: 1.3
    cog_m: [-0.026, 0.028, 0.030]
  # IMPORTANT: ur_rtde uploads its own control script. The External Control URCap must NOT be
  # playing, and the robot must be in Remote Control on the pendant.

base_frame: base_link            # ROS base_link; transforms.py bridges to the UR `base` frame
tip_frame: tool0                 # the pendant all-zeros TCP; NOT `flange` (that is 90 deg twisted)
camera_frame: camera1_color_optical_frame

# ---- Hand-eye (tool0 -> camera), from the calibration T_TCP_TO_CAMERA0 ----
# Eye-in-hand. This single static edge replaces the entire ur_tf_demo package.
hand_eye:
  xyz: [0.0, -0.080, 0.031]
  rpy: [0.0, 0.0, 0.0]           # identity, matching dev's calibration -- SEE the hand-eye note

# ---- Camera (RealSense D405) ----
camera:
  serial_no: "218622272137"
  width: 1280
  height: 720
  fps: 15                          # D405 max at 1280x720 is 15 fps
  enable_depth: false

# ---- Gripper (Robotiq 2F-85 over Modbus RTU) ----
# COUNTS are native now (0 open .. 255 closed) -- no more rad<->counts fudge via full_close_rad.
gripper:
  port: /dev/ttyUSB0             # prefer a stable /dev/serial/by-id/... path
  baud: 115200
  open_counts: 0
  closed_counts: 255
  speed_counts: 255
  force_counts: 150
  timeout_s: 5.0

# ---- Speed caps (HARD ceilings, applied as RTDE limits) ----
speed:
  max_joint_velocity_rad_s: 0.5
  max_cartesian_velocity_m_s: 4.0
  joint_acceleration_rad_s2: 1.2
  cartesian_acceleration_m_s2: 0.5
  min_move_duration_s: 0.5       # kept for schema parity; RTDE paces by velocity, not duration

move_timeout_s: 60.0
settle_s: 0.5
confirm_each_step: true
debug: false
