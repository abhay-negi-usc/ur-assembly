# Shared ROBOT-BOX definition -- LOADED as the BASE LAYER under every config (urlab/config.py
# _apply_common): any top-level block a config does not define is taken from here. A config that
# defines a block owns it WHOLESALE (no per-key merge), and `--set` still wins over everything.
#
# ONLY robot-box facts live here: the robot connection, the camera device, and the global speed
# caps. FRAMES live in configs/frames.yaml (the shared catalogue); per-cable data (grasp counts,
# junction pose, mate targets by frame name) lives in configs/cables.yaml.

# ---- Robot (RTDE) ----
robot:
  ip: 192.168.10.106
  dry_run: false                 # --dry-run overrides; plans every move without a robot
  # Tool payload (gripper + coupler + camera): mass + CoG in the tool0 frame (mm). REQUIRED so
  # getActualTCPForce() subtracts the tool weight and reports true EXTERNAL force.
  payload:
    mass_kg: 1.3
    cog_mm: [-26.0, 28.0, 30.0]
  # IMPORTANT: ur_rtde uploads its own control script. The External Control URCap must NOT be
  # playing, and the robot must be in Remote Control on the pendant.

base_frame: base_link            # ROS base_link; transforms.py bridges to the UR `base` frame
tip_frame: tool0                 # the pendant all-zeros TCP; NOT `flange` (that is 90 deg twisted)
camera_frame: camera1_color_optical_frame

# ---- Camera (RealSense D405) ----
camera:
  serial_no: "218622272137"
  width: 1280
  height: 720
  fps: 15                          # D405 max at 1280x720 is 15 fps

# ---- Global speed caps (the modern four-key schema; see docs/cable_pick_estimate_assemble.md).
# All four are enforced simultaneously -- whichever binds. A config with its own speed: block
# overrides ALL of this (whole-block ownership). ----
speed:
  max_joint_velocity_deg_s: 30.0
  max_joint_acceleration_deg_s2: 30.0
  max_cartesian_translation_mm_s: 25.0
  max_cartesian_rotation_deg_s: 30.0
