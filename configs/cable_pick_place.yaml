# Cable pick-and-place. Scan the cable from several views, fuse SAM3 neck detections into a 3D
# connector pose, grasp there, place. Ported from ur_cable_pick_place_demo -- but the SAM3
# detector and the multi-view fusion now run IN THIS PROCESS (see sam3 + connector_estimator
# below), so there is no external node, no TF topic, and no staleness to tune: the scan captures a
# frame, runs SAM3 on it, and ingests the result synchronously.
#
# Connector frame convention (built by the estimator, consumed as-is):
#   x = the cable-connector AXIS (the one rotational DOF the fusion measures),
#   z = "up" (connector_estimator.up_axis, default base +Z), re-orthogonalized perpendicular to x,
#   y = z x x.

robot:
  ip: 192.168.125.2
  dry_run: false
base_frame: base_link
tip_frame: tool0                 # the flange IK solves for; NOT the fingertip (~18 cm away)
camera_frame: camera1_color_optical_frame

hand_eye:                        # tool0 -> camera (eye-in-hand); replaces ur_tf_demo
  xyz: [0.0, -0.080, 0.031]
  rpy: [0.0, 0.0, 0.0]

camera:
  serial_no: "218622272137"
  width: 1280
  height: 720
  fps: 15                          # D405 max at 1280x720 is 15 fps

# ---- SAM3 detector (in-process) ----
sam3:
  repo_path: /abhay_ws/sam3-abhay   # the checkout holding cable_neck_core.py + the model venv
  mode: neck                        # neck | tip
  cable_prompt: cable
  connector_prompt: connector
  adaptive: true                    # tune the threshold per image above a confidence floor
  confidence_floor: 0.2
  mislabel_overlap: 0.6

# ---- Multi-view fusion (the connector pose estimator) ----
connector_estimator:
  min_views: 2
  min_inlier_views: 3
  min_parallax_deg: 3.0            # rotating in place adds NO information; refuse a low-parallax fit
  ransac_iters: 200
  inlier_dist_m: 0.010
  max_range_m: 0.80
  neck_diameter_m: 0.02
  up_axis: [0.0, 0.0, 1.0]         # pins the roll about the axis (NOT a measurement)
  workspace_min: [-10.0, -10.0, -10.0]   # matches dev connector_pose_node default (no box)
  workspace_max: [10.0, 10.0, 10.0]

connector_frame: connector

# Offset of the FINGERTIP target from the connector frame (x=axis, z=up, y=side). Identity -> the
# fingertip lands on the connector frame at grasp.
connector_grasp:
  xyz: [0.0, 0.0, 0.0]
  rpy: [0.0, 0.0, 0.0]

grasp_tcp_offset:                # gripper frame relative to tool0 (identity here)
  xyz: [0.0, 0.0, 0.0]
  rpy: [0.0, 0.0, 0.0]

# The FINGERTIP, relative to tool0. rpy is EXTRINSIC XYZ (sxyz); = [180, 0, 90] deg intrinsic.
fingertip_grasp:
  xyz: [0.0, -0.01254, 0.175]
  rpy: [3.14159, 0.0, -1.5708]

# ---- Scan phase ----
scan:
  require_detection: true
  min_good_views: 4
  max_passes: 3
  view_settle_s: 0.5             # let the arm settle before capturing (a still frame is a good frame)

  approach:
    enabled: true
    step_m: 0.010
    min_distance_m: 0.200        # the VIEW FLOOR -- inside the D405's ~70-500 mm working range
    nominal_distance_m: 0.23
    scale_offsets: true          # xyz scales with range; tilts do not (invariant -- see the note)
    recenter: true               # aim the optical axis at the connector every step

  relative_bounds:               # safety clamp on |offset| from the scan-start pose, camera frame
    xyz: [0.08, 0.08, 0.05]
    rpy: [0.35, 0.35, 0.10]

  # 12 views: start + an 8-point 4 cm ring + a 3-point 6.5 cm ring. Each tilts ~10 deg back toward
  # the target so the connector stays framed. tilt = atan(offset / 0.23 m).
  offsets:
    - {xyz: [ 0.000,  0.000, 0.00], rpy: [ 0.0000,  0.0000, 0.0]}
    - {xyz: [ 0.040,  0.000, 0.00], rpy: [ 0.0000, -0.1722, 0.0]}
    - {xyz: [ 0.028,  0.028, 0.00], rpy: [ 0.1224, -0.1224, 0.0]}
    - {xyz: [ 0.000,  0.040, 0.00], rpy: [ 0.1722,  0.0000, 0.0]}
    - {xyz: [-0.028,  0.028, 0.00], rpy: [ 0.1224,  0.1224, 0.0]}
    - {xyz: [-0.040,  0.000, 0.00], rpy: [ 0.0000,  0.1722, 0.0]}
    - {xyz: [-0.028, -0.028, 0.00], rpy: [-0.1224,  0.1224, 0.0]}
    - {xyz: [ 0.000, -0.040, 0.00], rpy: [-0.1722,  0.0000, 0.0]}
    - {xyz: [ 0.028, -0.028, 0.00], rpy: [-0.1224, -0.1224, 0.0]}
    - {xyz: [ 0.056,  0.032, 0.00], rpy: [ 0.1404, -0.2400, 0.0]}
    - {xyz: [-0.056,  0.032, 0.00], rpy: [ 0.1404,  0.2400, 0.0]}
    - {xyz: [ 0.000, -0.065, 0.00], rpy: [-0.2754,  0.0000, 0.0]}

  # Phase 2: ORBIT the cable axis at constant standoff -- the only motion that sharpens the axis.
  refine:
    enabled: true
    orbit_deg: [12.0, -12.0, 20.0, -20.0]
    max_orbit_deg: 25.0
    min_height_m: 0.12           # MUST be below approach.min_distance_m or every orbit is rejected

save_scan_images: true
data_dir: data
scan_images_subdir: cable_pick_place

# ---- Pick approach / lift / place ----
approach_distance_m: 0.10
approach_axis: [0.0, 0.0, 1.0]   # in the GRASP frame
lift_distance_m: 0.10
lift_axis: [0.0, 0.0, 1.0]       # in the BASE frame (+Z up)
place_offset_xyz: [0.050, 0.0, 0.0]
place_offset_rpy: [0.0, 0.0, 0.0]

gripper:
  port: /dev/ttyUSB0
  open_counts: 0
  closed_counts: 255
  speed_counts: 255
  force_counts: 150

# ---- Grasp check (counts). closed_counts is compared to what the gripper REPORTS -- no rad
# conversion, so the old full_close_rad "TODO: verify me" fudge is gone. ----
grasp_check:
  enabled: true
  closed_counts: 228             # counts at full closure (cable seated in the groove, or empty)
  tolerance_counts: 1
  detect_empty: false            # gOBJ-based empty detection -- UNVERIFIED on this hardware; see gripper.py
  settle_s: 1.0
  max_retries: 2

speed:
  max_joint_velocity_rad_s: 0.5
  max_cartesian_velocity_m_s: 4.0
  joint_acceleration_rad_s2: 1.2

move_timeout_s: 60.0
settle_s: 0.5
confirm_each_step: true
debug: false
