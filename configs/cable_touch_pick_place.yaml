# Cable TOUCH-then-pick. Vision gives x/y/yaw; TOUCH gives z (the camera's weak depth axis). The
# probe is the gripper's own fingers, fully closed. Ported from ur_cable_touch_pick_place_demo.
#
# Perception uses the SAM3 TIP pipeline (mode: tip) -- CLASSIFICATION-FREE (it unions the cable and
# connector masks), so it survives SAM3 labelling the whole assembly "cable", which starves the
# neck pipeline. connector_frame is named connector_tip so the inherited scan refines the TIP axis.

hand_eye:
  xyz_mm: [0.0, -80.0, 31.0]
  rpy_deg: [0.0, 0.0, 0.0]

sam3:
  mode: tip                        # the TIP detector: classification-free
  cable_prompt: cable
  connector_prompt: connector
  adaptive: true
  confidence_floor: 0.2
  curve_px: 40                     # arc length walked back from the tip for the axis

connector_estimator:
  min_views: 2
  min_inlier_views: 3
  min_parallax_deg: 3.0
  inlier_dist_mm: 10.0
  max_range_mm: 800.0
  up_axis: [0.0, 0.0, 1.0]
  workspace_min: [-10.0, -10.0, -10.0]   # matches dev connector_pose_node default (no box)
  workspace_max: [10.0, 10.0, 10.0]

connector_frame: connector_tip

grasp_tcp_offset:
  xyz_mm: [0.0, 0.0, 0.0]
  rpy_deg: [0.0, 0.0, 0.0]
fingertip_grasp:
  xyz_mm: [0.0, -12.54, 181.65]
  rpy_deg: [179.9998479605, 0.0, -90.0002104591]

# WHERE TO TOUCH / GRASP, relative to the TIP frame (x = connector axis toward the tip; -x = back
# along the cable). Grasp defaults to the touch point -- z is only KNOWN where we touched.
touch_offset:
  xyz_mm: [-50.0, 0.0, 0.0]
  rpy_deg: [0.0, 0.0, 0.0]
grasp_offset:
  xyz_mm: [-50.0, 0.0, 0.0]
  rpy_deg: [0.0, 0.0, 0.0]

# ---- Touch probe: fingers fully closed, position-controlled descent, force checked BEFORE each step ----
touch:
  force_n: 3.0                     # VERY low -- a probe, not a push. KEEP THE E-STOP IN HAND.
  step_mm: 1.0                    # 1 mm -> bounds the force overshoot to one step
  max_descent_mm: 60.0
  settle_s: 0.25
  hover_height_mm: 50.0
  contact_z_offset_mm: 0.0          # added to the contact z for the grasp; tune on the real part
  tare_before: true

align:
  max_iterations: 8
  pos_deadband_mm: 2.0
  ang_deadband_deg: 1.5

# ---- Scan (refines the TIP axis; same machinery as cable_pick_place) ----
scan:
  require_detection: true
  min_good_views: 4
  max_passes: 3
  view_settle_s: 0.5
  max_view_distance_mm: 250.0      # a detected view counts toward min_good_views only
                                  # within this range; farther detections still steer
                                  # the approach in but do not count (>= approach floor)
  approach:
    enabled: true
    step_mm: 10.0
    min_distance_mm: 200.0
    nominal_distance_mm: 230.0
    scale_offsets: true
    recenter: true
  relative_bounds:
    xyz_mm: [80.0, 80.0, 50.0]
    rpy_deg: [20.05352282958, 20.05352282958, 5.72957795131]
  offsets:
    - {xyz: [ 0.000,  0.000, 0.00], rpy: [ 0.0000,  0.0000, 0.0]}
    # First two views: PURE TRANSLATION (tilt zeroed) -- see cable_pick_place.yaml for the rationale
    # (unknown range before a fit; a nominal-range tilt can over-rotate the cable out of frame).
    - {xyz: [ 0.040,  0.000, 0.00], rpy: [ 0.0000,  0.0000, 0.0]}
    - {xyz: [ 0.028,  0.028, 0.00], rpy: [ 0.0000,  0.0000, 0.0]}
    - {xyz: [ 0.000,  0.040, 0.00], rpy: [ 0.1722,  0.0000, 0.0]}
    - {xyz: [-0.028,  0.028, 0.00], rpy: [ 0.1224,  0.1224, 0.0]}
    - {xyz: [-0.040,  0.000, 0.00], rpy: [ 0.0000,  0.1722, 0.0]}
    - {xyz: [-0.028, -0.028, 0.00], rpy: [-0.1224,  0.1224, 0.0]}
    - {xyz: [ 0.000, -0.040, 0.00], rpy: [-0.1722,  0.0000, 0.0]}
    - {xyz: [ 0.028, -0.028, 0.00], rpy: [-0.1224, -0.1224, 0.0]}
    - {xyz: [ 0.056,  0.032, 0.00], rpy: [ 0.1404, -0.2400, 0.0]}
    - {xyz: [-0.056,  0.032, 0.00], rpy: [ 0.1404,  0.2400, 0.0]}
    - {xyz: [ 0.000, -0.065, 0.00], rpy: [-0.2754,  0.0000, 0.0]}
  refine:
    enabled: true
    orbit_deg: [12.0, -12.0, 20.0, -20.0]
    max_orbit_deg: 25.0
    min_height_mm: 120.0

save_scan_images: true
data_dir: data
scan_images_subdir: cable_touch_pick_place

approach_distance_mm: 100.0
approach_axis: [0.0, 0.0, 1.0]
lift_distance_mm: 100.0
lift_axis: [0.0, 0.0, 1.0]
place_offset_xyz: [0.050, 0.0, 0.0]
place_offset_rpy: [0.0, 0.0, 0.0]

gripper:
  port: COM3
  open_counts: 0
  closed_counts: 255
  speed_counts: 255
  force_counts: 150

grasp_check:
  enabled: true
  closed_counts: 228
  tolerance_counts: 1
  detect_empty: false
  settle_s: 1.0
  max_retries: 2

# Keep speeds MODEST: the descent is a stack of ~60 one-millimetre moves.
speed:
  max_joint_velocity_deg_s: 22.91831180523
  max_cartesian_velocity_mm_s: 4000.0
  # 2026-08-18: unified on the _common.yaml value. Four different accelerations were in
  # use across the fleet (30 / 57.3 / 68.8 / 286.5 deg/s^2) because the legacy
  # `joint_acceleration_rad_s2` spelling and the arm's built-in default were shadowing
  # the modern key; 30.0 is the one every deliberately-maintained config already used.
  max_joint_acceleration_deg_s2: 30.0

move_timeout_s: 60.0
settle_s: 0.5
confirm_each_step: true            # STRONGLY recommended: this demo drives the arm into contact
debug: false
