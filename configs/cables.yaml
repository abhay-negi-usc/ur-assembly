# ============================================================================
# Per-cable / per-connector parameters.
#
# Select the active cable in a demo config with `cable: <name>` (e.g. `cable: banana`), or on the
# CLI with `--set cable=bnc`. The config loader then OVERRIDES the gripper endpoints, grasp-check
# counts, and grasp offset from the chosen entry (see urlab/config.py apply_cable_profile). Add a
# cable by copying an entry. If `cable` is unset, this file is ignored and the demo's own
# gripper/grasp_check apply.
#
# The grasp TARGET is the CONNECTOR. Fingertip positions are gripper COUNTS; more obstruction =
# LOWER count, so they order:
#     open (3)  <  connector (the TARGET, thicker)  <  cable (thinner)  <  closed/empty (231)
# A close that stops in the `connector` range -> connector seated              = grasp SUCCESS
#                       at the `cable` count (higher, thinner) -> grabbed the cable, not the connector = MISS
#                       below `connector` (thicker / faces)                     = MISS
#                       around `closed`                                          = EMPTY
#
# Mapping applied to the config:
#   gripper.port/open/closed/speed/force -> gripper.port / *_counts
#   gripper.closed -> gripper.closed_counts  AND  grasp_check.empty_counts
#   <cable>.connector -> grasp_check success BAND: faces_max_counts = min-1, groove_max_counts = max,
#                        groove_counts = midpoint; also grasp_check.connector_counts = [min, max]
#   <cable>.cable     -> grasp_check.cable_counts   (reference; grabbing the cable = a MISS)
#   <cable>.connector_diameter_mm -> grasp_check.connector_counts DERIVED through the calibrated
#                        gripper kinematic model + gripper.groove_depth_mm (PREFERRED over the raw
#                        count keys; also passed through as grasp_check.connector_diameter_mm for
#                        the payload-width check). cable_diameter_mm passes through likewise.
#   <cable>.junction_in_fingertip -> junction_in_fingertip  (the JUNCTION pose wrt the FINGERTIP at
#                        the grasp: the robot poses the fingertip so the detected junction lands
#                        exactly there, then closes the gripper. Replaces junction_offset_m AND the
#                        demo configs' connector_grasp -- the fingertip grasp target is
#                        detected_junction @ inverse(junction_in_fingertip).)
#   <cable>.connector_in_holder -> connector_in_holder  (the held connector's pose wrt connector_holder;
#                        used by uncertain_sampling as the connector frame)
#   <cable>.connector_holder_target -> connector_holder_target  (recorded base->connector_holder at the
#                        mate; used by uncertain_sampling as the assembly target)
#
# POSE UNITS. Pose blocks here (connector_in_holder, connector_holder_target) may be written in
# MONITOR UNITS -- `xyz_mm` (mm) + `rpy_deg` (deg) -- so a reading can be pasted straight off the
# monitor with no conversion. `xyz`/`rpy` (m/rad, the repo-wide convention) still work. The unit is
# in the KEY NAME so the two can never be confused; setting both for one triple is an error.
#   <cable>.target_connector_pose -> assembly.target_connector_pose   (future)
# ============================================================================

# Gripper hardware + endpoints (identical for all cables). These live SOLELY here now -- the cable
# demo configs no longer carry a `gripper:` block; a selected `cable:` supplies all of it.
gripper:
  port: /dev/ttyUSB0
  open: 3
  closed: 228            # fully closed on nothing
  speed: 255
  force: 150
  # Per-fingertip V-groove depth (mm) -- lets the gripper kinematic model convert PHYSICAL object
  # widths <-> stall counts (an object seated in the grooves stalls at face gap = width - 2*this).
  # Calibrated from the banana connector band; see urlab/robot/gripper_kinematics.py. NOTE this is
  # an EFFECTIVE depth: the band it was fitted on was measured at the working grip force, so the
  # typical PAD COMPRESSION (real grasps squeeze the pads -- desired, grip pressure; all separation
  # values elsewhere are zero-compression) is already absorbed here on average.
  groove_depth_mm: 3.77

cables:
  banana:
    # PHYSICAL dimensions (preferred): the grasp-check count band is DERIVED from these through
    # the calibrated gripper kinematic model + groove_depth_mm. The measured count keys below
    # are kept as the recorded reference; when both are present the DIAMETERS win and the
    # loader logs the derived-vs-measured comparison.
    connector_diameter_mm: [9.55, 10.7]   # grasp SUCCESS = fingers stalled on this (the target)
    cable_diameter_mm: 3.66               # thinner than 2*groove: stalls in the flex region
    connector: [207, 213]   # measured reference (CONNECTOR between the fingertips = SUCCESS)
    cable: 225              # measured reference (grabbing the CABLE instead = a MISS)
    # Where the JUNCTION sits in the FINGERTIP frame at the grasp (fingertip target =
    # detected junction @ inverse of this). Monitor units (mm/deg) -- xyz/rpy (m/rad) also work.
    junction_in_fingertip:
      xyz_mm:  [-17.0, 0.0, 0.0]
      rpy_deg: [0.0, 0.0, 0.0]
    # Assembly CALIBRATION: this connector's pose wrt connector_holder (connector_holder -> connector),
    # used by uncertain_sampling as the held connector frame. MEASURE per connector: hold the connector
    # in the holder, hand-guide, and read base_link<-connector vs connector_holder off the monitor.
    # Identity = unmeasured (connector coincides with connector_holder).
    connector_in_holder:
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
    # Recorded ASSEMBLY TARGET for the connector_holder (base_link -> connector_holder at the mate),
    # read off the monitor after hand-guiding to a good mate. PER-CABLE (each socket is elsewhere).
    # Used by uncertain_sampling; the connector target = this @ connector_in_holder.
    # In MONITOR UNITS (mm, deg) -- paste straight from the monitor line, no conversion.
    connector_holder_target:
      xyz_mm:  [90.26, 1072.67, -181.61]
      rpy_deg: [-0.71, 0.12, 88.73]

  bnc:
    connector: [197, 206]
    cable: 221
    junction_in_fingertip:    # MEASURE (see banana); zeros = junction exactly at the fingertip
      xyz_mm:  [0.0, 0.0, 0.0]
      rpy_deg: [0.0, 0.0, 0.0]
    connector_in_holder:      # MEASURE (see banana)
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
    # connector_holder_target:   # RECORD off the monitor (mm, deg) before running uncertain_sampling
    #   xyz_mm:  [0.0, 0.0, 0.0]
    #   rpy_deg: [0.0, 0.0, 0.0]

  c13:
    connector: [195, 198]
    cable: 218
    junction_in_fingertip:    # MEASURE (see banana); zeros = junction exactly at the fingertip
      xyz_mm:  [0.0, 0.0, 0.0]
      rpy_deg: [0.0, 0.0, 0.0]
    connector_in_holder:      # MEASURE (see banana)
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
    # connector_holder_target:   # RECORD off the monitor (mm, deg) before running uncertain_sampling
    #   xyz_mm:  [0.0, 0.0, 0.0]
    #   rpy_deg: [0.0, 0.0, 0.0]
