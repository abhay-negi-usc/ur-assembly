# ===================================================================================================
# CALIBRATION CHECK -- repeated slow probes of the recorded target (urlab/apps/calibration_check.py).
#
# Answers, in ~two minutes: is the recorded mate still where the physical socket is, and how
# repeatable is contact? Contact x should sit near the physical face-to-face offset with sub-mm
# std and NO trend across cycles; a drift means the fixture, the grasp or the frame is moving.
# The 2026-08 hose campaign lost a full estimator-eval session to exactly such a shift.
#
# The connector is RIGIDLY FIXTURED between the CLOSED gripper fingers; the gripper is never
# constructed. NO estimation, NO belief updates -- pure geometry + force.
# ===================================================================================================

robot:
  ip: 192.168.125.2
  dry_run: false
  payload:                       # same values as estimator_eval -- true EXTERNAL force readout
    mass_kg: 1.3
    cog_mm: [-26.0, 28.0, 30.0]
base_frame: base_link
tip_frame: tool0

# WHAT IS HELD, and WHAT IT IS PROBED AGAINST -- both names from configs/frames.yaml.
#   held_frame    a frames: entry -- tool0 -> the part fixtured between the closed fingers.
#   target_frame  a targets: entry -- base_link <- the recorded mate to probe. null = held_frame.
# Set target_frame to probe this held part against a DIFFERENT recorded target (a second socket,
# a re-measured one) without adding a catalogue entry. The contact pose reported is the held frame
# w.r.t. the target frame, so the two should describe the same point on the part.
held_frame: bnc_connector_finger_holder
target_frame: null

cycles: 10                       # how many probe -> contact -> retract repetitions
retract: false                    # false = leave the arm AT the contact and end after ONE probe.
                                 # For irreversible mates (a fully assembled hose): the robot
                                 # cannot back out until a human presses the unlock button.
standoff_distance_mm: 30.0       # backed off along the connector's own -X (free space)
overshoot_mm: 0.0               # command slightly PAST the recorded mate so contact is certain
resolution_mm: 1.0              # straight-line waypoint spacing

speed:
  approach_translation_mm_s: 2.0 # SLOW on purpose: gentle first contact, crisp trip point
  retract_translation_mm_s: 20.0
  max_joint_velocity_deg_s: 30.0 # free-space joint moves between cycles
  # 2026-08-18: unified on the _common.yaml value. Four different accelerations were in
  # use across the fleet (30 / 57.3 / 68.8 / 286.5 deg/s^2) because the legacy
  # `joint_acceleration_rad_s2` spelling and the arm's built-in default were shadowing
  # the modern key; 30.0 is the one every deliberately-maintained config already used.
  max_joint_acceleration_deg_s2: 30.0

compliance:
  enabled: true
  tare_before: true
  mass:          [50.0, 50.0, 50.0, 5.0, 5.0, 5.0]
  # 2026-08-18: unified across the map/eval/assembly chain. Stiffness decides what force
  # a given pose produces, so the app that BUILDS the map and every app matched against
  # it must agree or the observations sit off the map by construction.
  stiffness:     [500.0, 500.0, 500.0, 10.0, 10.0, 10.0]
  damping_ratio: [10.0, 10.0, 10.0, 10.0, 10.0, 10.0]
  # LOGGED dwell at the stop, under admittance (contrast hold_after_insertion_s, which is
  # un-guarded and NOT logged). These rows go into the map and into the estimator input.
  #
  # 5.0 s because that is what makes them MEAN something. At damping_ratio 10 the spring is
  # loaded to ~15 N at the stop and relaxes to a ~0.94 N equilibrium with a ~0.5 s contact
  # time constant. Measured fraction of settle rows sitting ON that equilibrium: 0% at 0.5 s,
  # 0% at 2.0 s, 60% at 5.0 s. A row still in the transient is a pose whose force depends on
  # HOW THE APPROACH ENDED rather than on the pose, which the estimator cannot explain and
  # therefore reads as noise. Costs ~5 s per pass -- see the app docs before trimming.
  settle_s: 5.0

force_guard:
  enabled: true
  max_force_n: 15.0              # a probe should FEEL the face, not press it
  max_torque_nm: 4.0
  persistence_s: 0.0             # instant: the trip point IS the measurement here -- a
                                 # debounce would smear the contact pose by the extra travel
