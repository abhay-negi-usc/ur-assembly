# Cartesian jog demo. See _common.yaml for the robot block's meaning.
robot:
  ip: 192.168.125.2
  dry_run: false
base_frame: base_link
tip_frame: tool0

speed:
  max_joint_velocity_rad_s: 0.5
  max_cartesian_velocity_m_s: 0.10
  joint_acceleration_rad_s2: 1.2

linear_step_m: 0.030
angular_step_deg: 30.0
motion_frames: [world, tool0]    # jog once per frame; world = base axes, tool0 = tool axes

move_timeout_s: 60.0
settle_s: 0.5
confirm_each_step: true
debug: false
