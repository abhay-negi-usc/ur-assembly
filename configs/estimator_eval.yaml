# In-hand pose ESTIMATOR EVALUATION -- the manifold ICP scored against a KNOWN ground truth.
# The connector is RIGIDLY FIXTURED between the CLOSED gripper fingers (like uncertain_sampling's
# held part), so the true in-hand pose IS the shared catalogue's held_frame entry. Each trial
# injects a known belief error (eval.perturbation), runs the same assemble -> retract -> estimate
# loop as cable_pick_estimate_assemble, and logs the exact ground-truth error left after every
# update. THE GRIPPER IS NEVER OPENED OR CLOSED (it is not even constructed).
# See urlab/apps/estimator_eval.py.
#
# ASSUMPTION: LINEAR (PEG-IN-HOLE) ASSEMBLY -- single-axis insertion along the connector's +X;
# the retract is the reverse translation along that same axis.

robot:
  ip: 192.168.125.2
  dry_run: false
  # Tool payload (gripper + coupler + camera + the fixtured connector) so getActualTCPForce()
  # reports true EXTERNAL force. Same values as cable_pick_estimate_assemble.
  payload:
    mass_kg: 1.3
    cog_m: [-0.026, 0.028, 0.030]
base_frame: base_link
tip_frame: tool0

# ---- GROUND TRUTH from the SHARED catalogue (configs/frames.yaml) ----
# frames: entry  = the true tool0 -> connector pose of the fixtured part;
# targets: entry = the recorded base_link mate. Both REQUIRED -- this app cannot run without them.
held_frame: hose_connector_finger_holder

# ---- Path (same trajectory the pick app assembles with) ----
trajectory_csv: assembly_trajectory.csv
trajectory_angles_deg: false
translational_resolution_m: 0.001
rotational_resolution_deg: 1.0

# Stand-off: the DISASSEMBLED rest between trials -- the trajectory START backed off a further
# standoff_distance_m along standoff_axis, planned from the TRUE held pose (a fixed physical
# spot regardless of the current belief). Visited once at start and after every trial.
standoff_distance_m: 0.050
standoff_axis: [-1.0, 0.0, 0.0]

# After each attempt: back straight out along the BELIEVED connector's own -X by this distance.
# Must exceed the insertion depth so the part is fully clear before the next free-space move.
retract_distance_m: 0.100

# ===================================================================================================
# EVAL -- the trial loop and the injected belief errors
# ===================================================================================================
eval:
  num_trials: 50                 # IGNORED when mode: grid (the grid derives the count)
  max_attempts: 5                # assemble -> estimate updates per trial

  # HOW the injected errors are chosen: 'random' draws uniformly inside the bounds for
  # num_trials; 'grid' sweeps every combination at grid_resolution (count derived, like
  # uncertain_sampling's grid mode); 'bounds' tests the +/- bound extremes (count derived) --
  # one DOF at a time by default (2 per two-sided DOF, 1 per degenerate DOF), or with
  # bounds_simultaneous every CORNER of the box at once (2^k for k two-sided DOFs).
  mode: bounds
  bounds_simultaneous: true     # bounds mode only: false = 1 DOF at a time; true = all
                                 # active DOFs at an extreme simultaneously (box corners)
  # Injected BELIEF error bounds, uncertain_sampling's convention: ABSOLUTE lower/upper per DOF
  # [x, y, z (m), roll, pitch, yaw (deg)], applied in the HELD part's OWN frame -- the same
  # right-multiplied frame the estimator corrects in. As set: x +/-5 mm, z +/-5 mm, pitch +/-5 deg.
  perturbation:
    lower: [-0.000, 0.0, -0.001, 0.0, -5.0, 0.0]
    upper: [ 0.000, 0.0, +0.001, 0.0, +5.0, 0.0]
  # Grid step per DOF (grid mode only), same order/units as the bounds.
  grid_resolution: [0.001, 0.0, 0.001, 0.0, 1.0, 0.0]

  # A trial CONVERGES when the remaining GROUND-TRUTH error (not the believed check!) is within
  # both tolerances; stop_when_converged skips its remaining attempts.
  success_tolerance:
    pos_mm: 0.25
    rot_deg: 0.25
  stop_when_converged: true

  # PHYSICAL success: the measured (TRUE) connector pose wrt the TARGET connector at the end
  # of an insertion within these per-DOF tolerances [x, y, z (mm), roll, pitch, yaw (deg)].
  # Success TERMINATES the trial; the live figure shows the running success rate.
  success_pose_tol: [2.0, 1.0, 5.0, 5.0, 5.0, 1.0]

  random_seed: 1                 # >0 = replayable perturbation stream; 0 = nondeterministic
  log_decimation: 5              # observation every Nth servo cycle (125 Hz / N -> ~25 Hz)
  save_observations: true        # per-attempt observation CSVs (the post-analysis raw data)
  # ---- P(SEAT) GATE + the single definition of SUCCESS -------------------------------------
  # The manifold's own trials are labelled by how deep they got, which turns it into a dataset
  # of (offset -> seated?) and gives P(seat | offset) by k-NN. The estimator never knows its
  # remaining error, so the gate uses the POSTERIOR quantity E_p[P(seat)] over the energy
  # landscape -- not P(seat) at the point estimate. Once it clears p_seat_threshold the trial
  # stops probing and commits to ONE insertion with NO trajectory noise. The SAME depth rule
  # then decides whether that insertion actually seated, so gate and verdict cannot disagree.
  seat_gate:
    enabled: true
    p_seat_threshold: 0.95       # commit once the posterior says the belief will seat this often
    seat_margin_mm: 4.0          # seated := reached within this of the reference depth
    # WHICH depth counts as fully inserted: 'max' is the literal deepest manifold row, a NUMBER
    # is that percentile of the per-trial maxima. MEASURED on the 2026-08 hose map: 'max' sets
    # the threshold at +24.9 mm -- a crush-through outlier that NOTHING reaches, so 0% of trials
    # count as seated and the gate can never open; p95 sets it at -5.1 mm with 61% seating,
    # which matches the force-verified seat rate. Hence the percentile default. The startup log
    # prints the seat rate for 'max' and for 99.9/99/95/90 so this can be re-checked per map.
    depth_reference: 95.0
    neighbors: 25                # k for the P(seat) vote
    posterior_temp: 0.05         # Gibbs temperature (relative to E_min) for the posterior
  # Extra column on the trial/live figure: the ICP energy over a DENSE GRID of candidate
  # corrections, with the APPLIED estimate and its +/- sigma (from the curvature at the minimum,
  # in each dim's own units) against the TRUE correction, plus every multi-start final. This is
  # the panel that separates "the solver picked badly" (truth sits in a deep basin it missed)
  # from "the landscape's minimum is in the wrong place" (truth sits on a slope -- a DATA
  # problem). Costs one grid-x-observations kNN sweep per attempt; both are capped in code.
  # The sigma values also land in trials.csv as sigma_<dim>.
  plot_landscape: true
  save_plots: true               # per-TRIAL error figure (trial_TTT_errors.png), RE-SAVED after
                                 # every attempt: ground-truth error vs attempt, all attempts
                                 # co-plotted (x = 0 is the injected error), plus the ICP
                                 # residual track and a residual-vs-L2-outcome scatter

  # LIVE figure: ONE fixed path OUTSIDE the per-experiment folder, atomically overwritten with
  # the current trial's figure after every attempt -- keep it open in an image viewer across
  # trials and runs. true = data/experiments/estimator_eval_live.png; a string = explicit path;
  # false disables. (Needs save_plots: true.)
  live_plot: true

  # ACCUMULATE observations across a trial's attempts (the part is FIXTURED, so the rigid
  # belief-error assumption holds for the whole trial): each estimate uses ALL of the trial's
  # observations so far -- prior attempts RE-PROJECTED into the current belief after every
  # correction (rel_new = rel_old @ T_corr; wrench re-based likewise). Earlier attempts sample
  # different manifold regions (extra constraint where one attempt is degenerate, e.g. the
  # z-pitch valley) and recency weighting decays them naturally. false = current attempt only.
  accumulate_observations: true

  # OPTIONAL trajectory noising: smoothed zero-mean Gaussian offsets applied to EVERY waypoint
  # in the connector's OWN frame, REDRAWN per attempt -- exercises the estimator with varied
  # contact instead of the same nominal path every time. Uses its OWN random stream, so
  # toggling it does not change the injected-error draws (noised/nominal runs stay pairable).
  trajectory_noise:
    enabled: true
    # PER-DIMENSION per-waypoint std [x, y, z (m), roll, pitch, yaw (deg)], applied after
    # smoothing; a zero entry leaves that DOF unperturbed. (Legacy scalar keys translation_m /
    # rotation_deg still work when 'std' is absent.)
    std: [0.000, 0.000, 0.010, 0.0, 3.0, 0.0]
    smooth_window: 10            # moving-average window (waypoints) -- keeps the reference smooth
    noise_decay_attempt: 0.1     # fraction to shrink the WHOLE perturbation by each attempt:
                                 # attempt k is scaled (1 - f)^(k-1)
    noise_decay_traj: 0.5        # fraction shed linearly over the trajectory: full at the first
                                 # waypoint -> x(1 - f) at the last (converge onto nominal at seat)
    alternate_pitch_deg: +0.0     # deterministic INITIAL pitch offset added to the noise, sign
                                 # ALTERNATING per attempt (+, -, +, ...): probe the z-pitch
                                 # valley from both sides; subject to both decays

  # OPTIONAL final insertion: after a trial's estimation attempts, ONE more guarded assemble
  # along the NOMINAL trajectory from the FINAL corrected belief, with this stiffness override
  # (other compliance values unchanged) -- does the corrected belief actually seat? No
  # estimation, no belief update; logged to trials.csv as attempt='final_insertion' (excluded
  # from summary.csv).
  final_insertion:
    enabled: true
    stiffness: [1500.0, 1500.0, 250.0, 10.0, 10.0, 10.0]

# ===================================================================================================
# ESTIMATION -- the contact-manifold ICP under test. KEEP IN SYNC with the values
# cable_pick_estimate_assemble_check runs with -- this app exists to score exactly that
# configuration (and, with the ground truth known, to VALIDATE its trust scores: both land
# in trials.csv as trust_* columns).
# ===================================================================================================
estimation:
  # The AUGMENTED manifold (clean map + 30k truth-corrected production-process rows) and the
  # rawcap wrench representation -- the 2026-08-09 offline winners. Fall back to the classic
  # setup with: manifold_csv ./configs/data/banana_manifold_20260807_clean.csv,
  # wrench_representation unit, s_force 3.0, s_torque 1.0.
  manifold_csv: ./configs/data/hose_manifold.csv
  wrench_representation: rawcap
  scaling_constant_deg_to_mm: 1.0
  scaling_constant_unit_force_to_mm: 1.5
  scaling_constant_unit_torque_to_mm: 0.0
  min_force_n: 3.0
  min_observations: 20
  estimate_dims: [z_mm, pitch_deg]
  icp_iterations: 20
  num_initial_guesses: 500
  init_guess_range:
    x_mm: 0.0
    y_mm: 0.0
    z_mm: 3.0
    roll_deg: 0.0
    pitch_deg: 10.0
    yaw_deg: 0.0
  step_gain: 1.0
  ransac_iters: 100
  ransac_tol: 1.0
  # AGGREGATOR over the multi-start finals: 'ransac' = residual-gated consensus vote (the
  # original); 'softmax' = weighted mean of ALL finals, weight exp(-(r - r_min) /
  # (softmax_temp x r_min)) -- the 2026-08 offline ablation's winner (residual carries more
  # information than cluster mass; ignores residual_gate / ransac_*). softmax_temp is RELATIVE
  # to the best residual: 0.15 = a final 15% worse than the best carries ~0.37x its weight.
  aggregator: ransac
  softmax_temp: 0.15
  residual_gate: 1.5
  recency_half_life_frac: 0.0
  interp_neighbors: 16
  interp_softness: 1.0
  random_seed: 0

  # ---- SOLUTION CHECK (urlab/skills/solution_check.py) -- OBSERVATIONAL trust scoring. ----
  # Same block as cable_pick_estimate_assemble_check: after every estimate, candidate
  # corrections are re-scored against the observations and BOTH trust scores (rankavg2 +
  # cauchy) are computed and logged -- here they ALSO land in trials.csv (trust_* columns)
  # next to the known ground-truth error, which is how the scores get validated/recalibrated.
  # The correction is always applied; `method` only picks which score carries the LOW label.
  check:
    enabled: true
    method: cauchy
    flag_threshold: 0.75
    n_candidates: 128
    candidate_range:
      z_mm: 6.0
      pitch_deg: 12.0
    calibration_file: ./configs/data/check_calibration.json
    config_disagreement: false

# COMPLIANCE (software admittance) for the insertion -- MIRRORS cable_pick_estimate_assemble's
# assembly.compliance so the estimator sees production-like observations.
compliance:
  enabled: true
  tare_before: true
  mass:          [50.0, 50.0, 50.0, 5.0, 5.0, 5.0]
  stiffness:     [1500.0, 1500.0, 250.0, 10.0, 10.0, 10.0]
  damping_ratio: [10.0, 10.0, 10.0, 10.0, 10.0, 10.0]
  selected_axes: [1, 1, 1, 1, 1, 1]
  reference_rate_hz: 125.0
  warmup_s: 0.1
  settle_s: 0.5
  lookahead_time_s: 0.1
  servo_gain: 300.0
  max_delta_m: 0.05
  max_delta_rad: 0.5

force_guard:
  enabled: true
  max_force_n: 50.0
  max_torque_nm: 8.0

speed:
  # Free-space moves (the approach to each attempt's start and the between-trial stand-off).
  max_joint_velocity_deg_s: 30.0
  joint_acceleration_rad_s2: 1.0
  max_cartesian_velocity_m_s: 0.25
  # INSERT reference pacing -- matches the pick app's effective assemble speed
  # (global 25 mm/s / 30 deg/s x phase_scale.assemble 0.2).
  max_cartesian_translation_mm_s: 10.0
  max_cartesian_rotation_deg_s: 30.0
  # RETRACT -- free-space escape back along a path just proven clear.
  retract_translation_mm_s: 100.0
  retract_rotation_deg_s: 10.0

move_timeout_s: 120.0
settle_s: 0.2
confirm_each_step: false
debug: false
