# ===================================================================================================
# ESTIMATOR EVALUATION -- PROBE phase + INSERTION phase (see urlab/apps/estimator_eval_probe.py).
#
# The 2026-08-11 hose information campaign's recommendations, made testable:
#   * probes exist to GATHER INFORMATION -- their own stiffness, their own guard, and a LONG
#     settle so the logged wrench is SETTLED like the manifold's (this is the fix for the 40.8 deg
#     wrench mismatch that made every estimator score at corr ~0);
#   * probes carry an ALTERNATING pitch bias -- diverse probes break aliases (on hard cases 3
#     alternating probes cut the 75th-percentile error from 11.08 to 1.63 deg);
#   * the belief is NOT updated between probes; their energies FUSE and ONE correction is applied;
#   * the estimate is an EXHAUSTIVE grid (no multi-start, no aggregator), rows weighted by
#     informativeness-vs-depth, uncertainty = curvature at the minimum + a multi-modality flag;
#   * the INSERTION phase then tests the corrected belief at PRODUCTION stiffness.
#
# The connector is RIGIDLY FIXTURED between the CLOSED gripper fingers, so the true in-hand pose
# IS configs/frames.yaml's held_frame entry. THE GRIPPER IS NEVER OPENED OR CLOSED.
# ===================================================================================================

robot:
  ip: 192.168.125.2
  dry_run: false
  payload:
    mass_kg: 1.3
    cog_m: [-0.026, 0.028, 0.030]
base_frame: base_link
tip_frame: tool0

# The hose connector fixtured in the closed fingers + its recorded mate (configs/frames.yaml).
held_frame: hose_connector_finger_holder

trajectory_csv: assembly_trajectory.csv
trajectory_angles_deg: false
translational_resolution_m: 0.001
rotational_resolution_deg: 1.0

standoff_distance_m: 0.025
standoff_axis: [-1.0, 0.0, 0.0]
retract_distance_m: 0.050

# ===================================================================================================
# EVAL -- the injected belief errors (same conventions as estimator_eval.yaml)
# ===================================================================================================
eval:
  num_trials: 20                 # IGNORED when mode: grid/bounds (the count is derived)
  mode: bounds
  bounds_simultaneous: false     # false = one DOF at a time -- cleaner for reading the results
  # ABSOLUTE lower/upper per DOF [x, y, z (m), roll, pitch, yaw (deg)], in the held part's OWN
  # frame. BOTH z and pitch are injected. bounds_simultaneous: false sweeps one DOF at a time
  # (4 trials: z+-5 mm, pitch+-8 deg) -- the cleanest way to read which DOF the estimator
  # actually recovers; set it true for the box CORNERS (both DOFs wrong at once, the harder and
  # more production-like case).
  perturbation:
    lower: [0.0, 0.0, -0.003, 0.0, -8.0, 0.0]
    upper: [0.0, 0.0, +0.003, 0.0, +8.0, 0.0]
  grid_resolution: [0.0, 0.0, 0.0025, 0.0, 4.0, 0.0]

  # ---- P(SEAT) GATE + the single definition of SUCCESS -------------------------------------
  # The manifold's trials are labelled by how deep they got, which makes it a dataset of
  # (offset -> seated?) and gives P(seat | offset) by k-NN. The robot never knows its remaining
  # error, so the gate uses E_p[P(seat)] over the fused landscape's posterior, NOT P(seat) at the
  # point estimate. Probing STOPS as soon as it clears p_seat_threshold, then one insertion runs
  # with NO trajectory noise. The SAME depth rule scores that insertion, so gate and verdict
  # cannot disagree.
  seat_gate:
    enabled: true
    # CEILING WARNING: P(seat) is bounded by how repeatably the PROCESS seats. On the 2026-08
    # hose map, trials at near-identical offsets agree on seated/not only 67% of the time (a
    # ~83% per-trial ceiling), and P(seat) at ZERO offset is 72% with the settings below -- a
    # 0.95 gate would never open even from a perfect estimate. The startup log prints both the
    # best-offset and zero-offset ceilings; keep this under the zero-offset one, or raise
    # seat_margin_mm (6.0 -> 84% at zero offset, 10.0 -> 96%).
    p_seat_threshold: 0.80
    # MODE RANKING at commitment. 'energy' = commit the fused landscape's argmin (the
    # original behaviour). 'p_seat' = candidates are the argmin PLUS every mixture mode's
    # centre, and the one whose application maximises E_p[P(seat)] over the posterior is
    # committed. Motivation (2026-08-12 validation on real runs): when rival basins differ by
    # a few percent in energy the depth ordering is noise -- the truth sat in a NON-dominant
    # mode in 54% of fused probe cases -- but the candidates differ a lot in what committing
    # to them does to P(seat), which is the quantity this gate acts on anyway. The gate and
    # the commitment use the SAME ranking, so the gate can never open on a correction that
    # would not actually be applied. trials.csv logs ranked_mode (-1 = argmin kept) and
    # p_seat_argmin next to p_seat, so the offline win-rate of the re-ranking is measurable.
    mode_ranking: p_seat
    seat_margin_mm: 4.0          # seated := reached within this of the reference depth
    # 'max' = the literal deepest manifold row, a NUMBER = that percentile of the per-trial
    # maxima. MEASURED on the 2026-08 hose map: 'max' puts the threshold at +24.9 mm (a
    # crush-through outlier nothing reaches -> 0% seated, the gate never opens); p95 puts it at
    # -5.1 mm with 61% seated, matching the force-verified rate. The startup log prints the seat
    # rate for 'max' and 99.9/99/95/90 so this can be re-checked whenever the map changes.
    depth_reference: 95.0
    neighbors: 25
    posterior_temp: 0.05
  save_plots: true               # per-trial figure (trial_TTT.png), re-saved every trial
  # LIVE figure: ONE fixed path OUTSIDE the experiment folder, atomically overwritten after every
  # trial -- keep it open in an image viewer across runs. true =
  # data/experiments/estimator_eval_live.png (the SAME file estimator_eval writes, so one open
  # viewer serves both apps); a string = explicit path; false disables.
  live_plot: true

  success_tolerance:             # ground-truth convergence gate (logged, not enforced)
    pos_mm: 4.0
    rot_deg: 1.0
  # PHYSICAL success of the insertion phase: TRUE connector pose wrt the target, per DOF
  # [x, y, z (mm), roll, pitch, yaw (deg)].
  success_pose_tol: [2.0, 1.0, 5.0, 5.0, 5.0, 1.0]

  random_seed: 7
  log_decimation: 5              # observation every Nth servo cycle (125 Hz / N -> ~25 Hz)
  save_observations: true

# ===================================================================================================
# PROBE PHASE -- insertions whose only job is to gather information
# ===================================================================================================
probe:
  attempts: 10                    # 3 alternating probes was the validated setting

  # THE CRITICAL KNOB. The manifold was collected by uncertain_sampling with a 5 s hold, and this
  # admittance (damping_ratio 10, z stiffness 250 N/m) needs ~1.2 s of true rest to reach 95% of
  # the settled contact wrench. estimator_eval's 0.5 s logged TRANSIENTS -- the measured wrench
  # then sat 40.8 deg off the manifold (self-consistency floor 12.3 deg) and every estimator
  # scored at corr ~0. If the run logs few 'settled_rows', raise this.
  settle_s: 2.0

  # Deliberate per-probe bias, SIGN ALTERNATING (+, -, +, ...) in the connector's own frame.
  # Diversity of probes -- not optimality of any one probe -- is what breaks aliases. With BOTH
  # z and pitch estimated, jog both: a pitch-only probe pattern moves the physical offset along
  # the z-pitch valley, which is exactly the direction that does NOT disambiguate it.
  alternate_pitch_deg: 5.0
  alternate_z_mm: 2.0            # 0 = pitch-only probing

  # MODE-DIRECTED probing. The fixed +/- schedule gathers more of the same KIND of evidence, and
  # a BETWEEN-mode spread does not shrink with more of the same evidence -- only a discriminating
  # action shrinks it. So once the fused landscape holds genuine rivals, the next probe COMMANDS
  # one of them: bias = inverse(that mode's correction), which is exactly the path the robot
  # would drive if that mode were true. If it is, the probe inserts deep and logs the
  # high-information rows near the socket mouth; if it is not, it stops shallow. The belief is
  # never updated during the probe phase, so betting on the wrong mode costs one probe, not the
  # estimate. Modes are taken in turn, heaviest first.
  mode_directed: true
  mode_min_separation: 2.0       # top-2 gap in units of the WITHIN-mode width; under ~2 the
                                 # "modes" are one blurred basin and the schedule handles it
  mode_min_ambiguity: 0.15       # ... and the runner-up must hold at least this much mass
  mode_bias_limit: [5.0, 10.0]   # clamp on the commanded bias [mm, deg] -- a mode parked at the
                                 # edge of the grid must not command a large excursion

  # PER-WAYPOINT TRAJECTORY NOISE -- PROCESS-CRITICAL, matched to how the manifold was collected.
  # uncertain_sampling draws a fresh offset on EVERY waypoint (y +-0.5 mm, z +-5 mm, pitch +-5
  # deg, UNSMOOTHED), and that jitter is what walks a misaligned cylindrical peg off the hole's
  # rim and into the bore. Without it the peg's leading face simply lands on the rim and the
  # insertion stops ~15 mm short: measured early-landing rate (max true x < -14 mm) was 6% for
  # the manifold, 32% for the noised estimator_eval, and 68% for a noise-free probe phase.
  # smooth_window 1 = unsmoothed, like the map's collection. Redrawn per probe.
  trajectory_noise:
    enabled: true
    std: [0.0, 0.0005, 0.005, 0.0, 5.0, 0.0]   # [x,y,z (m), roll,pitch,yaw (deg)]
    smooth_window: 1
    decay_traj: 0.0              # optionally shed the jitter toward the seat (0 = keep it all)

  # Probe compliance/guard: SOFTER and more conservative than production -- a probe should feel
  # the contact, not force the mate. Overrides compliance.stiffness / force_guard.max_force_n.
  stiffness: [1500.0, 1500.0, 150.0, 8.0, 8.0, 8.0]
  max_force_n: 50.0
  retract_distance_m: 0.050

# ===================================================================================================
# INSERTION PHASE -- the real attempt from the corrected belief, at PRODUCTION stiffness
# ===================================================================================================
insertion:
  stiffness: [1500.0, 1500.0, 250.0, 10.0, 10.0, 10.0]
  settle_s: 0.5
  max_force_n: 50.0

# ===================================================================================================
# ESTIMATION -- exhaustive grid over the contact manifold
# ===================================================================================================
estimation:
  manifold_csv: ./configs/data/hose_manifold.csv
  wrench_representation: rawcap
  # rawcap SATURATION: the wrench feature is unit(f) x min(|f| / rawcap_force_ref_n,
  # rawcap_cap) -- magnitude in units of the reference, CAPPED at rawcap_cap. Saturation
  # therefore sits at ref x cap: 10 N x 3.0 = 30 N force, 1 Nm x 3.0 = 3 Nm torque. Above
  # that, harder pressing adds nothing to the feature (by design -- extreme forces are the
  # least reproducible part of the signal). These are the code defaults, spelled out so the
  # threshold is visible and tunable here rather than buried in skills/manifold.py.
  rawcap_force_ref_n: 10.0
  rawcap_torque_ref_nm: 1.0
  rawcap_cap: 3.0
  scaling_constant_deg_to_mm: 0.2
  # PER-DIMENSION pose weights, ON TOP of the unit scaling above: the scaling constant stays
  # the mm <-> deg CONVERSION, dim_weights say how much each dimension MATTERS relative to the
  # others in the match (partial dicts fill with 1.0; delete the block for the uniform metric).
  # 0 is allowed only on dimensions NOT being estimated. Example: y is fixtured (down-weight),
  # z is the decisive channel (up-weight).
  dim_weights:
    x_mm: 1.0
    y_mm: 1.0
    z_mm: 1.0
    roll_deg: 1.0
    pitch_deg: 1.0
    yaw_deg: 1.0
  scaling_constant_unit_force_to_mm: 1.5
  scaling_constant_unit_torque_to_mm: 0.0
  min_force_n: 3.0
  min_observations: 10

  # BOTH DOFs. Pitch is the more identifiable one (the campaign's 1-DOF result), so if the
  # results are murky, drop to [pitch_deg] with a pitch-only perturbation to isolate it.
  estimate_dims: [z_mm, pitch_deg]

  interp_neighbors: 64
  interp_softness: 1.0
  recency_half_life_frac: 0.0    # probes are independent measurements; no recency decay
  random_seed: 0

  # ---- STOP-SIGNATURE FUSION -- same option and tuning as estimator_eval.yaml ---------------
  # Every probe's observed stop depth adds a SuccessBasin.stop_energy curve to the fused grid
  # energy; the combined decision energy drives the P(seat) gate, the mode ranking, and the
  # committed correction, which alpha then partially applies. Probes make the stop channel
  # STRONGER than in estimator_eval: several stops at different biases triangulate the offset.
  # Measured on the 2026-08-12/13 v3 replays: single attempt |z'| 2.55 vs 3.05 no-correction;
  # 3-5 fused trajectories ~1.1 mm at alpha 0.6 (the accumulated-regime optimum -- this app
  # fuses multiple probes, so it uses 0.6 like estimator_eval with accumulation, not the
  # single-shot 0.75). false = original behaviour.
  stop_fusion:
    enabled: true
    weight: 2.0
    alpha: 0.6

  grid:
    # Half-width of the exhaustive search box per estimated dim, and its resolution. COST: the
    # candidate count is the PRODUCT over dims and every candidate is scored against every
    # observation row, so keep 2-D grids coarse. As set: 33 x 57 = 1881 candidates (~seconds per
    # probe). At 0.25 steps it would be 65 x 113 = 7345 -- 4x slower for sub-noise resolution.
    range:
      z_mm: 8.0
      pitch_deg: 14.0
    step:
      z_mm: 0.5
      pitch_deg: 0.5
    # Weight rows by informativeness vs insertion depth (d' 0.7 in the approach -> 2.4 at the
    # socket mouth). 'none' = uniform.
    info_weighting: depth
    # Uncertainty = 1/curvature at the minimum, from two extra evaluations at theta* +- this,
    # PER DIM in that dim's own units (mm / deg). 3 deg validated for pitch (AUROC 0.89-0.91);
    # 1 deg does NOT work (it measures interpolation noise). Must exceed two grid steps.
    curvature_probe_deg: 3.0     # fallback for any dim not listed below
    curvature_probe:
      z_mm: 3.0
      pitch_deg: 3.0
    # Sublevel factor for the multi-modality FLAG: >1 component => 44% failure rate vs 6%.
    mode_threshold: 1.1

    # ---- MIXTURE uncertainty (skills/mixture.py) --------------------------------------------
    # A single sigma over a multi-modal landscape reports the DISTANCE BETWEEN RIVALS, not the
    # width of any one of them -- so the landscape is decomposed into its steepest-descent
    # basins and the spread is split into WITHIN (one hypothesis' precision; more probing
    # shrinks it) and BETWEEN (mass on rivals; only a DISCRIMINATING probe shrinks it, which is
    # what probe.mode_directed does). trials.csv logs both, plus ambiguity/separation.
    posterior_temp: 0.05         # Gibbs temperature, RELATIVE to the minimum energy
    mode_min_weight: 0.02        # basins under this posterior mass fold into their neighbours

    # ---- SUPPORT-aware uncertainty ----------------------------------------------------------
    # The residual says how WELL the observations fit the map; it says nothing about whether the
    # map HAS anything there. support_ratio = (distance to the k-th manifold neighbour at the
    # chosen correction) / (the map's k-th-neighbour distance AT THE SAME DEPTH): 1 = as well
    # surrounded as a typical map row, 2 = the nearest evidence is twice as far as normal.
    # REPORT-ONLY BY DEFAULT. 2026-08-12 validation on real runs came back SPLIT: on the
    # old-process eval attempts thin support predicts failure (AUROC 0.56, ratio >= 2 -> 72%
    # fail), but on THIS app's probe runs the signal is INVERTED (AUROC 0.38, ratio >= 2 ->
    # 12% fail, 0.72 mm-eq median error) even with the depth-conditional reference -- there,
    # high ratio marks the deep, seated, information-rich probes. A multiplier would widen
    # sigma on the best cases, so the ratio lands in trials.csv and inflates nothing.
    support_inflation: 0.0       # sigma *= max(1, support_ratio)^this. 0 = report only.
    # OPTIONAL and OFF by default: this one MOVES the answer rather than just flagging it, by
    # adding <this> mm-eq of energy per unit of missing support ratio. Raise only with evidence.
    support_penalty: 0.0

# ===================================================================================================
# COMPLIANCE -- the BASE admittance; probe/insertion override `stiffness` and `settle_s`.
# ===================================================================================================
compliance:
  enabled: true
  tare_before: true
  mass:          [50.0, 50.0, 50.0, 5.0, 5.0, 5.0]
  stiffness:     [1500.0, 1500.0, 250.0, 10.0, 10.0, 10.0]
  damping_ratio: [10.0, 10.0, 10.0, 10.0, 10.0, 10.0]
  selected_axes: [1, 1, 1, 1, 1, 1]
  reference_rate_hz: 125.0
  warmup_s: 0.1
  settle_s: 0.5
  lookahead_time_s: 0.1
  servo_gain: 300.0
  max_delta_m: 0.05
  max_delta_rad: 0.5

force_guard:
  enabled: true
  max_force_n: 50.0
  max_torque_nm: 8.0
  # Limit must hold this long continuously before tripping (0 = instant). Filters the F/T
  # spikes of hard contact transients; see estimator_eval.yaml for the rationale.
  persistence_s: 0.5

speed:
  max_joint_velocity_deg_s: 30.0
  joint_acceleration_rad_s2: 1.0
  max_cartesian_velocity_m_s: 0.25
  # NOTE the manifold was collected at 20 mm/s. Matching it removes one more process difference;
  # 5 mm/s is the production insert speed. Try 20.0 here if the wrench match stays poor.
  max_cartesian_translation_mm_s: 5.0
  max_cartesian_rotation_deg_s: 30.0
  retract_translation_mm_s: 50.0
  retract_rotation_deg_s: 50.0

move_timeout_s: 120.0
settle_s: 0.2
confirm_each_step: false
debug: false
