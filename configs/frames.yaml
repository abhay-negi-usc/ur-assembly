# ============================================================================
# FRAMES -- the single shared source of tool0-attached frames (urlab/frames.py).
#
# Every entry is a frame rigidly attached to the arm, defined wrt its `parent` (default: tool0,
# the flange / all-zeros pendant TCP). Parents may be OTHER frames declared here -- the loader
# flattens the chain to tool0 and rejects unknown parents and cycles at load time.
#
# POSE UNITS (same convention as cables.yaml): either the repo-standard `xyz` (m) + `rpy`
# (rad, extrinsic XYZ), or MONITOR UNITS `xyz_mm` (mm) + `rpy_deg` (deg) -- paste a line straight
# off urlab.apps.monitor with no conversion. The unit lives in the KEY name; setting both units
# for one triple is an error. THIS FILE is written uniformly in MONITOR UNITS (mm / deg).
#
# ADDING A FRAME IS ONE ENTRY HERE -- no code. Generic consumers (urlab.apps.monitor) list
# whatever this file contains.
#
# NOTE the Robot facade still reads the per-demo-config sections (fingertip_grasp, hand_eye,
# grasp_tcp_offset); the seeds below mirror cable_pick_estimate_assemble.yaml, and the loader's
# check_drift() WARNS when this file and a loaded config disagree, so the duplication cannot rot
# silently. Treat THIS file as the place to edit first.
#
# HELD CONNECTORS are declared here directly wrt tool0 (e.g. banana_connector_finger_holder) --
# the old connector_holder chain (holder mount + cables.yaml connector_in_holder /
# connector_holder_target) is RETIRED.
# ============================================================================

frames:
  # The gripper fingertip at the grasp (tool0 -> fingertip). Mirrors fingertip_grasp.
  fingertip:
    xyz_mm:  [0.0, 0.0, 183.0]
    rpy_deg: [180.0, 0.0, -90.0]

  # The RealSense color optical frame (tool0 -> camera). Mirrors hand_eye.
  camera:
    xyz_mm:  [-9.0, -80.0, 31.0]
    rpy_deg: [0.0, 0.0, 0.0]

  # The grasp TCP (tool0 -> grasp). Mirrors grasp_tcp_offset.
  grasp:
    xyz_mm:  [0.0, 0.0, 0.0]
    rpy_deg: [0.0, 0.0, 0.0]

  # The banana connector fixtured between the closed fingers (tool0 -> connector).
  banana_connector_finger_holder:
    xyz_mm:  [0.0, 0.0, 159.0]
    rpy_deg: [180.0, 0.0, -90.0]

  # The hose connector fixtured between the closed fingers (tool0 -> connector).
  hose_connector_finger_holder:
    xyz_mm:  [0.0, -78.0, 159.0]
    rpy_deg: [180.0, 0.0, +90.0]

  # The BNC connector fixtured between the closed fingers (tool0 -> connector).
  # CORRECTED 2026-08-15: y was -45.7 (sign error, and the comment was a copy of the hose
  # entry). The error was a PURE +91.4 mm translation along the connector's own +x, which
  # CANCELS for a straight insertion but acts as a LEVER ARM on any pitch: a commanded 5 deg
  # displaced the part 8 mm in z. targets: below was re-derived by the same correction.
  bnc_connector_finger_holder:
    xyz_mm:  [0.0, +45.7, 159.0]
    rpy_deg: [180.0, 0.0, +90.0]

# ============================================================================
# TARGETS -- recorded BASE_LINK poses of the frames above (base_link <- frame), e.g. the assembly
# mate. MEASURE: hand-guide to a good mate, read the `base_link <- <frame>` line off
# urlab.apps.monitor, paste it here (monitor units, mm / deg). Consumers name a frame (e.g.
# uncertain_sampling's `held_frame:`) and pull BOTH its tool0-attached pose above and its target
# here -- one file, one source. A target must have a matching frames: entry.
# ============================================================================
targets:
  # banana_connector_finger_holder at the mate (read off the monitor).
  banana_connector_finger_holder:
    xyz_mm:  [+26.40, +1079.66,  -185.12]
    rpy_deg: [+0.34,   -0.37,  +89.55]

  # hose_connector_finger_holder at the mate (read off the monitor).
  hose_connector_finger_holder:
    xyz_mm:  [-49.99, 947.55, -139.50]
    rpy_deg: [-86.91, +1.45, +94.20]

  # bnc_connector_finger_holder at the mate. RE-DERIVED 2026-08-15: the original reading was
  # taken off the monitor while frames: carried the -45.7 y sign error, so it inherited that
  # same +91.4 mm offset along the connector's +x. Corrected here by the identical transform
  # (target_new = target_old @ E), which keeps the recorded mate physically where it was.
  # Prefer a FRESH monitor reading when there is bench time -- this is arithmetic, not a
  # measurement.  (was xyz_mm [+108.52, +1013.93, -141.11])
  bnc_connector_finger_holder:
    xyz_mm:  [98.88, 1096.00, -139.96]
    rpy_deg: [-47.76, 1.77, 94.84]