# ===================================================================================================
# MARKER CALIBRATION -- the target's pose in each fiducial's frame (urlab/apps/marker_calibration.py).
#
# Produces one `marker_rigs:` block to paste into configs/frames.yaml. After that,
# bnc_assembly's `assembly.target_source: visual` finds the socket by LOOKING at the markers
# instead of trusting a mate recorded weeks ago by hand-guiding.
#
# THE ACCURACY OF THE RIG IS THE ACCURACY OF THE RECORDED TARGET IT IS CALIBRATED FROM. This
# script transfers `targets: <target_frame>` onto the markers; it does not measure the socket.
# Re-record that target BEFORE calibrating (hand-guide to a good mate, read `base_link <- <frame>`
# off urlab.apps.monitor). What the rig buys is INVARIANCE -- the fixture can be unbolted and
# moved and still be found -- not accuracy.
#
# Run with the markers ALREADY IN VIEW. The sweep is a small local ring around wherever it starts.
# ===================================================================================================

robot:
  ip: 192.168.125.2
  dry_run: false
  payload:
    mass_kg: 1.3
    cog_m: [-0.026, 0.028, 0.030]
base_frame: base_link
tip_frame: tool0
data_dir: data

camera:
  serial_no: "218622272137"
  width: 1280
  height: 720
  fps: 15                          # D405 max at 1280x720 is 15 fps

aruco:
  dictionary: DICT_4X4_50
  # Fallback side length for ids not named under markers: below. Every id the rig uses SHOULD be
  # named there instead -- solvePnP scales a marker's distance linearly with the size it is given,
  # so a marker solved at the wrong size lands at the wrong DEPTH with a perfect reprojection
  # behind it. There is nothing in the image to catch that.
  marker_size_m: 0.0197

# WHICH TARGET THE MARKERS ARE ATTACHED TO -- a `targets:` name in configs/frames.yaml. Its
# recorded base_link pose is what gets transferred onto the markers.
target_frame: bnc_connector_finger_holder

# THE MARKERS AND THEIR SIZES. `<id>: <side length in mm>`, or `<id>: {size_mm: ...}`. Sizes are
# REQUIRED per id and never defaulted. Measure the printed BLACK SQUARE edge to edge -- the white
# quiet zone is not part of the marker, and including it inflates the size by ~14% on a typical
# print, which is a ~14% depth error.
markers:
  24:  19.7
  25:  19.7

# Every declared marker must be seen, or the run fails. Set false to calibrate a partial rig (the
# missing ids simply do not appear in the block, and the existing frames.yaml entries stand).
require_all_markers: true

# OPTIONAL fixed viewpoint, joint degrees. Leave null to hand-guide the camera and confirm with
# Enter. PIN IT once the fixture is permanent, and use the SAME value for
# assembly.visual_target.view_joints_deg in bnc_assembly.yaml: calibrating from one viewpoint and
# localising from a very different one is legal, but it throws away the rig's best property --
# that both runs see the same marker faces at the same obliquity, so their PnP biases cancel.
view_joints_deg: null
confirm_start: true

# ---- THE VIEW SWEEP -------------------------------------------------------------------------
# Shared with bnc_assembly's visual localisation (urlab/skills/marker_localize.py). Offsets are
# CAMERA-FRAME poses relative to wherever the sweep starts; the markers are assumed in view.
#
# ONLY TRANSLATION ADDS INFORMATION. A single ArUco pose is a four-point PnP on a small planar
# square, and its weak direction is rotation about an axis IN the marker plane, which trades
# against depth. Moving the camera a few centimetres sideways sees that trade-off from a different
# angle; capturing ten frames without moving averages sensor noise and leaves the bias untouched.
# That is why frames_per_view collapses to ONE view and the offsets are a ring.
marker_views:
  settle_s: 0.4
  frames_per_view: 3               # captures averaged at each stop (sensor noise only)
  min_views: 3                     # a marker seen from fewer viewpoints is DROPPED, not fused
  min_markers: 1                   # (calibration: one marker is still worth recording)
  aim_at_markers: true             # re-point at the markers found so far, so the ring keeps them
  # Gates on the spread ACROSS VIEWS of one marker -- pixel noise and PnP conditioning. Exceeding
  # them WARNS (the fit still lands); null disables.
  max_view_spread_mm: 3.0
  max_view_spread_deg: 3.0
  # Gates on the spread ACROSS MARKERS. Not used by the calibration (each marker's offset is exact
  # by construction against the target it was solved from); they bite at RUN time, where a marker
  # that has been knocked or reprinted disagrees with its neighbours. Kept here so both apps read
  # the same block.
  max_disagreement_mm: 5.0
  max_disagreement_deg: 5.0
  # null = the built-in ring (centre, 40 mm at four bearings, 25 mm closer). Widen it for a large
  # rig; a marker that leaves the frame at an offset is simply skipped for that view.
  offsets: null
  # CERTAINTY WEIGHTING: a view at distance d fuses with weight d^-power (closer views are
  # more accurate).
  view_weight_power: 2.0
  # STANDOFF CAP: the camera never plans a view farther than this from the markers, and a
  # detection captured beyond it is never fused.  null disables.
  max_camera_distance_mm: 500.0
  # VISUAL SERVOING: after the sweep, servo to each marker in turn -- centred on it at
  # distance_m along its normal, re-detecting until two successive detections agree within
  # the tolerances -- then capture the vantage + an aimed parallax ring, which REPLACE that
  # marker's sweep views in the fusion.  The camera returns to the overview (all markers in
  # frame) between markers.  Keep this block IDENTICAL to bnc_assembly's marker_views.servo:
  # the rig's PnP biases cancel between calibration and run only when both look the same way.
  servo:
    enabled: true
    distance_m: 0.25
    max_iterations: 4
    pos_tol_mm: 0.5
    ang_tol_deg: 0.5
    ring_mm: 25.0
    ring_views: 4

# ---- Motion --------------------------------------------------------------------------------
# Free space with nothing in the fingers, but the arm is carrying a camera near a fixture.
speed:
  max_joint_velocity_deg_s: 30.0
  max_joint_acceleration_deg_s2: 30.0
  max_cartesian_translation_mm_s: 25.0
  max_cartesian_rotation_deg_s: 30.0
  # One factor for the whole visual-localization behavior (the sweep + servo moves) --
  # the same knob bnc_assembly's speed.phase_scale.visual_localize turns.
  phase_scale:
    visual_localize: 0.5
move_timeout_s: 60.0

force_guard:
  max_force_n: 30.0
