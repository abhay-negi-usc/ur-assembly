# Fiducial pick-and-place (ArUco). Detect a marker, visually approach, grasp, place.
hand_eye:
  xyz_mm: [0.0, -80.0, 31.0]
  rpy_deg: [0.0, 0.0, 0.0]

aruco:
  dictionary: DICT_4X4_50
  marker_size_mm: 20.3

# ---- Object to PICK ----
marker:
  id: 11
object_marker:                   # marker pose w.r.t. the object frame
  xyz_mm: [0.0, 63.5, 45.0]
  rpy_deg: [-90.0002104591, 0.0, 0.0]
object_grasp:                    # grasp-TCP pose w.r.t. the object frame
  xyz_mm: [0.0, 41.0, 45.0]
  rpy_deg: [179.9998479605, 0.0, 0.0]
grasp_tcp_offset:                # grasp TCP w.r.t. tool0
  xyz_mm: [0.0, 0.0, 160.0]
  rpy_deg: [0.0, 0.0, 0.0]
fingertip_grasp:                 # kept for the Robot facade; unused by this demo
  xyz_mm: [0.0, 0.0, 160.0]
  rpy_deg: [0.0, 0.0, 0.0]

# ---- Pick approach / lift / place ----
approach_distance_mm: 200.0
approach_axis: [0.0, 0.0, -1.0]
lift_distance_mm: 100.0
lift_axis: [0.0, 0.0, 1.0]
place_offset_xyz: [0.0, 0.20, 0.0]
place_offset_rpy: [0.0, 0.0, 0.0]

# ---- Visual approach ----
servo_standoff_mm: 60.0
servo_step_mm: 50.0
servo_cam_rpy_in_marker: [3.14159, 0.0, 0.0]
servo_max_iterations: 20
marker_max_age_s: 1.0

# ---- Reaching the grasp ----
blind_pick: true                 # true: home then open-loop grasp; false: closed-loop visual servo
servo_gain: 1.0
servo_max_linear_step_mm: 30.0
servo_max_angular_step_deg: 20.0
servo_pos_deadband_mm: 10.0
servo_ang_deadband_deg: 5.0

gripper:
  port: COM3
  open_counts: 0
  closed_counts: 200
  speed_counts: 255
  force_counts: 150

speed:
  max_joint_velocity_deg_s: 28.64788975654
  max_cartesian_velocity_mm_s: 4000.0
  # 2026-08-18: unified on the _common.yaml value. Four different accelerations were in
  # use across the fleet (30 / 57.3 / 68.8 / 286.5 deg/s^2) because the legacy
  # `joint_acceleration_rad_s2` spelling and the arm's built-in default were shadowing
  # the modern key; 30.0 is the one every deliberately-maintained config already used.
  max_joint_acceleration_deg_s2: 30.0

move_timeout_s: 60.0
settle_s: 0.5
confirm_each_step: true
debug: false
