# THE ROBOT-BOX DEFINITION -- one file for the machine, referenced EXPLICITLY by every config:
#
#     robot_config: robot.yaml
#
# The loader (urlab/config.py) fills any top-level block the config does not define from here.
# A config that defines a block owns it WHOLESALE (no per-key merge), and `--set` wins over
# everything. Swapping cells = editing THIS file (or pointing robot_config at another one).

robot:
  ip: 192.168.10.112
  dry_run: false                 # --dry-run overrides; plans every move without a robot
  # Tool payload (gripper + coupler + camera): mass + CoG in the tool0 frame (mm). REQUIRED so
  # getActualTCPForce() subtracts the tool weight and reports true EXTERNAL force.
  payload:
    mass_kg: 0.3
    cog_mm: [-26.0, 28.0, 30.0]
  # IMPORTANT: ur_rtde uploads its own control script. The External Control URCap must NOT be
  # playing, and the robot must be in Remote Control on the pendant.


# ---- Compute ----
# Where SAM3 (and future torch models) run.
#   auto -- cuda when available, else cpu. Right for configs shared between the GPU robot host
#           and CPU-only laptops.
#   cpu  -- force CPU even with a GPU present (GPU busy with other software).
#   cuda -- REQUIRE the GPU: fails at startup with a clear message if missing, instead of
#           crashing deep inside the first inference.
compute:
  device: auto

base_frame: base_link            # ROS base_link; transforms.py bridges to the UR `base` frame

tip_frame: tool0                 # the pendant all-zeros TCP; NOT `flange` (that is 90 deg twisted)

speed:
  max_joint_velocity_deg_s: 30.0
  max_joint_acceleration_deg_s2: 30.0
  max_cartesian_translation_mm_s: 25.0
  max_cartesian_rotation_deg_s: 30.0
