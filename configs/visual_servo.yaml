# Visual servo -- drive the camera to a fixed standoff square to a marker, continuously.
hand_eye:
  xyz_mm: [0.0, -80.0, 31.0]
  rpy_deg: [0.0, 0.0, 0.0]

aruco:
  dictionary: DICT_4X4_50
  marker_size_mm: 20.3

marker:
  id: 11

standoff_mm: 100.0
cam_rpy_in_marker: [3.14159, 0.0, 0.0]
servo_gain: 0.4
servo_max_linear_step_mm: 20.0
servo_max_angular_step_deg: 15.0
pos_deadband_mm: 5.0
ang_deadband_deg: 1.5
rate_hz: 2.0
marker_max_age_s: 0.5
confirm_start: true

speed:
  max_joint_velocity_deg_s: 22.91831180523
  max_cartesian_velocity_mm_s: 4000.0
  # 2026-08-18: unified on the _common.yaml value. Four different accelerations were in
  # use across the fleet (30 / 57.3 / 68.8 / 286.5 deg/s^2) because the legacy
  # `joint_acceleration_rad_s2` spelling and the arm's built-in default were shadowing
  # the modern key; 30.0 is the one every deliberately-maintained config already used.
  max_joint_acceleration_deg_s2: 30.0

move_timeout_s: 30.0
settle_s: 0.2
confirm_each_step: false
debug: false
