# Fiducial-guided pick-and-ASSEMBLE configuration.
#
# This file is self-contained: it holds the FULL pick configuration (identical schema to
# ur_pick_place_demo/config/pick_place.yaml -- the assembly node subclasses that node and reuses
# its pick pipeline) PLUS an `assembly:` section for the mate.
#
# Assembly transform chain (all xyz in meters, rpy in radians):
#   held object wrt tool0 (fixed once grasped):
#       T_tool0_held      = grasp_tcp_offset * inv(object_grasp)
#   target object in base (from the target marker at the view pose):
#       T_base_targetobj  = T_base_targetmarker * inv(assembly.target_object_marker)
#   assembled held-object pose in base:
#       T_base_held_final = T_base_targetobj * assembly.assembled_pose
#   tool0 target for a separation d along assembly.approach_axis (target-object frame):
#       T_base_tool0(d)   = T_base_targetobj * transl(approach_axis*d) * assembled_pose * inv(T_tool0_held)

# ======================================================================================
# PICK configuration (same as pick_place.yaml)
# ======================================================================================

# ---- Frames / motion infra ----
base_frame: base_link
tip_frame: tool0
planning_group: ur_manipulator
controller_action: /scaled_joint_trajectory_controller/follow_joint_trajectory
ik_timeout_s: 2.0
ik_attempts: 12
avoid_collisions: false

# ---- Marker / object to PICK ----
marker:
  id: 11
  dictionary: DICT_4X4_50
  size_m: 0.0203
  frame: ""
object_marker:
  xyz: [0.0, 0.0635, 0.045]
  rpy: [-1.5708, 0.0, 0.0]
object_grasp:
  xyz: [0.0, 0.041, 0.045]
  rpy: [3.14159, 0.0, 0.0]
grasp_tcp_offset:
  xyz: [0.0, 0.0, 0.16]
  rpy: [0.0, 0.0, 0.0]

# ---- Pick approach / lift ----
approach_distance_m: 0.20
approach_axis: [0.0, 0.0, -1.0]
lift_distance_m: 0.10
lift_axis: [0.0, 0.0, 1.0]

# ---- Visual approach ----
camera_frame: camera1_color_optical_frame
servo_standoff_m: 0.060
servo_step_m: 0.05
servo_cam_rpy_in_marker: [3.14159, 0.0, 0.0]
servo_max_iterations: 20
marker_max_age_s: 60.0
reacquire_timeout_s: 2.0
reacquire_retract_m: 0.01
reacquire_max_retries: 5

# ---- Reaching the grasp (blind vs. closed-loop servo) ----
blind_pick: true
servo_gain: 1.0
servo_max_linear_step_m: 0.03
servo_max_angular_step_deg: 20.0
servo_pos_deadband_m: 0.010
servo_ang_deadband_deg: 5.0

# place_offset is unused by the assembly demo (kept so the shared pick loader is happy).
place_offset_xyz: [0.0, 0.0, 0.0]
place_offset_rpy: [0.0, 0.0, 0.0]

# ---- Gripper ----
gripper:
  action: /robotiq_gripper_controller/gripper_cmd
  joint: robotiq_85_left_knuckle_joint
  open_position: 0.0
  closed_position: 0.8
  max_effort: 50.0
  max_velocity: 0.5

# ---- Speed (max velocity caps) ----
# Bound the arm's velocity so each free-space move's duration scales with its size (also avoids the
# joint-velocity-limit protective stops a fixed duration can trigger). The more restrictive cap wins;
# 0 disables that cap; if BOTH are 0, moves use move_duration_s. Caps bound AVERAGE speed (peak
# ~1.5x). Override: -p max_joint_velocity:=0.6 -p max_cartesian_velocity:=0.10. NOTE: this governs
# the position-controlled moves only -- the compliant mate is paced by assembly.compliance.
speed:
  max_joint_velocity_rad_s: 0.5     # cap on any single joint's speed (rad/s); 0 = off
  max_cartesian_velocity_m_s: 0.10  # cap on tool0 straight-line speed (m/s); 0 = off
  min_move_duration_s: 0.5          # floor so small moves aren't near-instantaneous

# ---- Timing / safety / debug ----
move_duration_s: 4.0             # per arm move (used only if BOTH speed caps above are 0)
move_timeout_s: 60.0
settle_s: 0.5
confirm_each_step: true
debug: false

# ======================================================================================
# ASSEMBLE configuration
# ======================================================================================
assembly:
  # View pose: where to put the CAMERA (w.r.t. base_link) so it can see the target marker.
  # The arm moves tool0 = view_pose * inv(tool0->camera). Set this so the target assembly's
  # marker is comfortably in frame.
  view_pose:
    xyz: [0.4, 0.0, 0.4]
    rpy: [3.14159, 0.0, 0.0]

  # Marker fixed to the TARGET assembly (distinct from the picked object's marker).
  target_marker:
    id: 12
    frame: ""                    # default camera1_marker_<id>; set to override

  # Pose of the target marker w.r.t. the TARGET OBJECT frame (T_targetobject_marker), predefined.
  target_object_marker:
    xyz: [0.0, 0.034, -0.033]
    rpy: [0.0, 0.0, 0.0]

  # ASSEMBLED pose: the held object's frame w.r.t. the target object when fully mated
  # (T_targetobject_held). This is the insertion goal.
  assembled_pose:
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]

  # Mating axis, in the TARGET OBJECT frame: the direction along which the held part separates
  # from the assembled pose. Pre-align and stand-off are the assembled pose backed off along it.
  approach_axis: [0.0, 0.0, 1.0]
  prealign_distance_m: 0.10       # coarse aligned pose, this far back along approach_axis
  standoff_distance_m: 0.03       # closer pose just before contact; the compliant move starts here

  # Compliance (mate under admittance control). Requires the ros2_control admittance_controller to
  # be LOADED (inactive) on the controller_manager -- see ur_admittance_demo. The insertion ramps
  # a joint reference from the stand-off to the assembled pose while the controller yields to
  # contact forces.
  compliance:
    admittance_controller: admittance_controller
    position_controller: scaled_joint_trajectory_controller
    switch_service: /controller_manager/switch_controller
    reference_topic: /admittance_controller/joint_references
    ft_zero_service: /io_and_status_controller/zero_ftsensor   # UR driver: tare the wrist F/T
    insertion_time_s: 5.0         # ramp the reference from stand-off to assembled over this long
    insertion_rate_hz: 20.0       # reference publish rate
    insertion_hold_s: 1.0         # keep publishing the last reference this long to settle
    # Force-guarded stop: halt the ramp when the TARED contact wrench reaches these magnitudes,
    # then hold there (part seated). The wrench is read after the F/T tare, so it's contact-only.
    wrench_topic: /force_torque_sensor_broadcaster/wrench
    max_force_n: 20.0             # stop when |force|  >= this (N).  0 disables the force check
    max_torque_nm: 5.0            # stop when |torque| >= this (Nm). 0 disables the torque check
