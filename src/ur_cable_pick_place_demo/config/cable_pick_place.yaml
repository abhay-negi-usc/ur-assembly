# Cable pick-and-place configuration.
#
# Like pick_place.yaml, but instead of detecting one fiducial the robot SCANS the cable from several
# views and reads the fused 3D connector pose that the external SAM3 nodes publish over TF
# (base_frame -> connector_frame). See the sam3-abhay repo for those nodes.
#
# Connector frame convention (built by connector_pose_node; consumed here AS-IS):
#   x = the cable-connector AXIS (the one rotational DOF the multi-view fusion measures),
#   z = "up" (that node's up_axis param, default base +Z; the "z coincident with base z" assumption),
#       re-orthogonalized perpendicular to x,
#   y = z x x  (completes the right-handed frame; horizontal).
# Every axis is meaningful, so `ros2 run tf2_ros tf2_echo base_link connector` shows the real frame.
# The grasp is that frame plus connector_grasp (below).

# ---- Frames / IK / controller ----
# tf_cache_s: how long THIS node keeps transforms. tf2's 10 s default is too short here -- the
# connector is only republished about once per SAM3 inference (~6-12 s, since the detector is slow and
# doesn't hit on every frame), so with a 10 s cache it EXPIRES from the buffer between publishes and
# the lookup fails even though connector_pose_node is publishing fine. Staleness is still enforced
# separately by connector_max_age_s, so a long cache is safe.
tf_cache_s: 60.0
base_frame: base_link
# tip_frame is the ROBOT'S TOOL FLANGE -- the link IK solves for. Despite the name, it is NOT the
# fingertip: they are ~18 cm apart. Everything else in this file hangs off it:
#     tip_frame (tool0) --grasp_tcp_offset--> gripper --fingertip_grasp--> fingertip  <-- grasp ref
#     tip_frame (tool0) --hand-eye (ur_tf_demo)--> camera_frame
# tool0 is the UR frame matching the pendant's all-zeros TCP. Do NOT switch this to `flange` (a
# DIFFERENT frame, twisted ~90 deg about Z) without also rewriting grasp_tcp_offset, fingertip_grasp
# AND the hand-eye parent -- mixing them silently offsets every target.
tip_frame: tool0
camera_frame: camera1_color_optical_frame   # optical frame the SAM3 detector uses
planning_group: ur_manipulator
controller_action: /scaled_joint_trajectory_controller/follow_joint_trajectory
ik_timeout_s: 2.0
ik_attempts: 12
avoid_collisions: false

# ---- Cable connector (the "object"), from the SAM3 pose estimator (Node 2) ----
connector_frame: connector       # the TF Node 2 broadcasts (run it with world_frame:=base_link)
# NOTE on staleness: connector_pose_node stamps the connector TF with the IMAGE timestamp, so the
# estimate is always at least one SAM3 inference behind (seconds, on a slow GPU). These must exceed
# the detector's latency or a perfectly good estimate gets rejected as "stale".
connector_max_age_s: 15.0        # a connector TF older than this = not yet estimated / stale
connector_wait_s: 25.0           # after the scan, wait up to this for a fresh connector estimate
# NOTE: the connector FRAME convention (x = cable axis, z = up, y = z x x) is built by
# connector_pose_node, not here -- this demo consumes its TF as-is. The "up" direction is that node's
# `up_axis` param (default [0,0,1] = the "connector z is coincident with base z" assumption).

# Optional offset of the FINGERTIP target from the connector frame (x=axis, z=up, y=side).
# Default identity -> the fingertip lands exactly on the connector frame at grasp.
connector_grasp:
  xyz: [0.0, 0.0, 0.0]
  rpy: [0.0, 0.0, 0.0]

# Grasp point between the fingers ("gripper" frame), relative to tip_frame (tool0). Same as pick_place.
grasp_tcp_offset:
  xyz: [0.0, 0.0, 0.16]
  rpy: [0.0, 0.0, 0.0]

# ---- Fingertip frame ----
# A frame AT the fingertip, defined w.r.t. the GRIPPER (grasp_tcp_offset) frame. The cable grasp is
# commanded so this fingertip frame coincides with the connector frame -- so the fingertip IS the
# grasp reference. Axes:  fingertip +x = gripper -y,  +y = gripper -x  (=> +z = gripper -z).
# NOTE on rpy: this is EXTRINSIC XYZ (sxyz). The above axes = [180, 0, 90] deg in INTRINSIC XYZ
# (the moving-frame convention CAD tools report) == [180, 0, -90] deg here = [pi, 0, -pi/2] rad.
# Translation is [0, 12.54, 181.65] mm w.r.t. the gripper.
fingertip_grasp:
  xyz: [0.0, 0.01254, 0.18165]
  rpy: [3.14159, 0.0, -1.5708]
publish_fingertip_tf: true       # broadcast tool0 -> fingertip so you can verify it coincides in RViz

# ---- Scan phase (multi-view for the SAM3 fusion) ----
# The camera scans RELATIVE to its pose at the START of the scan (jog the robot so the cable is in
# view first) -- NOT absolute base poses. Each view offsets the camera by offsets[i], expressed in
# the CAMERA frame (xyz in m, rpy in rad), CLAMPED to relative_bounds so the camera stays in a safe
# Cartesian box around the start. Give enough spread (translation) for PARALLAX while keeping the
# cable in frame. The default offsets sweep +/-4 cm along the camera's image axes.
scan:
  dwell_s: 10.0                    # hold at each view; MUST exceed SAM3's inference time (~6 s on a
                                   # pre-Ampere GPU) so each view gets one clean, STATIC frame
  relative_bounds:                 # max |offset| from the start pose, in the CAMERA frame (safety clamp)
    xyz: [0.06, 0.06, 0.05]        # +/- m along camera x (right), y (down), z (forward/depth)
    rpy: [0.25, 0.25, 0.10]        # +/- rad about camera x, y, z (0.25 rad ~ 14 deg; must exceed the
                                   # 10 deg view-keeping tilt below or it gets clamped away)
  # Each view TRANSLATES (for parallax) and TILTS 10 deg BACK TOWARD the start view, so the connector
  # stays framed instead of drifting out of view at the extremes. Camera optical axes: x = right,
  # y = down, z = forward. Moving +x makes the target drift LEFT, so we tilt about camera y by -10 deg
  # to aim back at it; moving +y (down) makes it drift UP, so we tilt about camera x by +10 deg.
  # (10 deg = 0.1745 rad re-centres a target ~23 cm away at a 4 cm offset: atan(0.04/0.23).)
  # The tilt costs nothing in parallax -- the ray from the camera CENTRE to the connector is unchanged
  # by rotation; only the translation supplies the baseline the triangulation needs.
  offsets:                         # per-view offset from the start pose (camera frame); clamped above
    - {xyz: [0.00, 0.00, 0.00], rpy: [0.0, 0.0, 0.0]}        # start view (no tilt)
    - {xyz: [0.04, 0.00, 0.00], rpy: [0.0, -0.1745, 0.0]}    # right + tilt back LEFT  (-10 deg about cam y)
    - {xyz: [-0.04, 0.00, 0.00], rpy: [0.0, 0.1745, 0.0]}    # left  + tilt back RIGHT (+10 deg about cam y)
    - {xyz: [0.00, 0.04, 0.00], rpy: [0.1745, 0.0, 0.0]}     # down  + tilt back UP    (+10 deg about cam x)
    - {xyz: [0.00, -0.04, 0.00], rpy: [-0.1745, 0.0, 0.0]}   # up    + tilt back DOWN  (-10 deg about cam x)

  # ---- PHASE 2: axis-aware refinement (run after the seed views above) ----
  # The AXIS is the least observable part of the connector pose, and the seed views above sweep the
  # camera's IMAGE axes blindly -- so roughly half of them land parallel to the cable and contribute
  # NOTHING to it. Here is why, and what to do instead:
  #
  #   The fusion recovers the axis as the intersection of back-projected planes. View k's 2D neck line
  #   back-projects to a plane containing the camera CENTRE C_k and the 3D axis line through P, whose
  #   normal is   n_k ~ a x (C_k - P)   -- perpendicular to both the axis and the viewing ray. The axis
  #   is the null space of the stacked n_k, so a new view only helps if it produces a DIFFERENT n_k,
  #   which requires moving the camera OUT of the current plane -- i.e. along n itself.
  #
  #   * Translating PARALLEL to the axis keeps C inside the same plane -> same n_k -> ZERO axis info.
  #     (It still gives parallax for the ORIGIN, so it isn't wasted -- just useless for the axis.)
  #   * Translating along  y = z x x  (the connector's OWN y: perpendicular to both the axis and the
  #     viewing direction) produces a new plane -> this is the ONLY translation that sharpens the axis.
  #
  # So once the seed views give a first estimate, these views ORBIT the camera AROUND THE CABLE AXIS at
  # a CONSTANT standoff, aimed at the measured connector origin. An orbit (rather than a straight slide
  # along y) is what keeps the view usable:
  #   * its tangent IS n, so it is exactly the informative motion,
  #   * |C - P| is preserved -> the connector stays at a constant range (constant scale/focus),
  #   * orbiting about the cable's OWN axis keeps the cable SIDE-ON: foreshortening never changes, so
  #     the cable stays fully visible at every angle,
  #   * the excursion is bounded by an ANGLE, so the camera cannot skew off the target -- which is
  #     exactly what an unbounded straight offset did (it drove the camera to oblique poses that lost
  #     the cable and connector entirely).
  # KEEP THESE MODEST. A big orbit about a horizontal cable swings the camera sideways AND DOWN toward
  # the table; min_height_m refuses any view that would drop it too low.
  refine:
    enabled: true
    orbit_deg: [12.0, -12.0, 20.0, -20.0]   # signed orbit angles about the cable axis (deg)
    max_orbit_deg: 25.0                     # hard clamp on |angle| -- keeps the view on the cable
    min_height_m: 0.12                      # skip any view that would put the camera lower than this
                                            # above the connector (table-collision / grazing guard)

# ---- Scan overlay output ----
# Save the SAM3 detector's overlay (masks + neck dot + orientation arrow) at each scan view -- the
# same annotated frame the sam3-abhay CLI produces -- so you can inspect the predictions. Images go
# to <data_dir>/<scan_images_subdir>/<run timestamp>/view_NN.png.
save_scan_images: true
debug_image_topic: /cable_neck_detector/debug_image   # Node 1's ~/debug_image (run it with publish_debug:=true)
data_dir: data                   # relative -> resolved from cwd (run from the workspace root)
scan_images_subdir: cable_pick_place

# ---- Pick approach / lift (same as pick_place) ----
approach_distance_m: 0.10        # grasp stand-off
approach_axis: [0.0, 0.0, -1.0]  # in the GRASP frame
lift_distance_m: 0.10
lift_axis: [0.0, 0.0, 1.0]       # in the BASE frame (+Z = up)

# ---- Place = pick pose shifted by this offset (BASE frame) ----
place_offset_xyz: [0.050, 0.0, 0.0]
place_offset_rpy: [0.0, 0.0, 0.0]

# ---- Gripper ----
gripper:
  action: /robotiq_gripper_controller/gripper_cmd
  joint: robotiq_85_left_knuckle_joint
  open_position: 0.0
  closed_position: 0.6           # tune to the cable/connector width
  max_effort: 50.0
  max_velocity: 0.5

# ---- Pick-up failure detection & recovery ----
# Detects the "cable not seated in the fingertip groove" failure from the gripper position in COUNTS
# (0-255, Robotiq). The grasp COMMANDS a full close; the fingers then stall at ~closed_counts when the
# cable is seated in the groove (or the fingers are empty), but SHORT of it (< closed_counts -
# tolerance_counts) when the cable is caught OUTSIDE the groove -> FAILED grasp. On failure: open
# (drop), return to the initial pose, and retry the whole scan->grasp sequence.
# NOTE: empty vs seated is NOT distinguished yet (both reach closed_counts) -- future work.
grasp_check:
  enabled: true
  closed_counts: 228             # counts at FULL closure (cable seated in the groove, or empty)
  tolerance_counts: 1            # reading >= closed_counts - tolerance_counts = "fully closed" (OK)
  # Counts are converted from the joint (radians) in /joint_states: counts = round(pos/full_close_rad*255).
  # full_close_rad = the knuckle joint value at 255 counts (its upper limit; ~0.8 for the 2F-85).
  # VERIFY: fully close the gripper, `ros2 topic echo /joint_states`, read robotiq_85_left_knuckle_joint;
  # that value should map to ~255. Adjust full_close_rad (or closed_counts) so the printed counts match.
  full_close_rad: 0.8
  settle_s: 1.0                  # wait after closing before reading the position (let it stall/seat)
  max_retries: 2                 # extra attempts after the first (total attempts = max_retries + 1)

# ---- Speed (max velocity caps) ----
# Bound the arm's velocity so each move's duration scales with its size (larger move -> more time),
# which also avoids the joint-velocity-limit protective stops a fixed duration can trigger. Set
# either or both caps; the more restrictive one wins. 0 disables that cap. If BOTH are 0, moves use
# the fixed move_duration_s below. Caps bound the AVERAGE speed of a move (peak ~1.5x for a smooth
# profile) -- set conservatively. Override at launch:
#   --ros-args -p max_joint_velocity:=0.6 -p max_cartesian_velocity:=0.10
speed:
  max_joint_velocity_rad_s: 0.5     # cap on any single joint's speed (rad/s); 0 = off
  max_cartesian_velocity_m_s: 0.10  # cap on tool0 straight-line speed (m/s); 0 = off
  min_move_duration_s: 0.5          # floor so small moves aren't near-instantaneous

# ---- Timing / safety / debug ----
move_duration_s: 4.0
move_timeout_s: 60.0
settle_s: 0.5
confirm_each_step: true          # prompt before each motion (recommended on real HW)
debug: false
