# Cable TOUCH-then-pick configuration.
#
# Same machinery as cable_pick_place.yaml (it subclasses that demo), but the connector's pose is
# obtained differently:
#
#   * VISION gives x, y and YAW. The camera looks DOWN, so those are LATERAL in the image -- the
#     well-determined directions of a multi-view fit.
#   * TOUCH gives Z. The connector's z IS the camera's depth direction, the WEAKEST axis of a
#     monocular fit (error ~ Z^2 / baseline; several mm here). So we measure it: close the fingers and
#     probe straight down until a very low force trips.
#   * ROLL and PITCH are assumed ZERO (the connector lies flat). That assumption is what makes a
#     SINGLE touch sufficient -- with roll/pitch free, one contact point could not pin down the height.
#
# Perception comes from the SAM3 TIP pipeline (sam3-abhay), which is CLASSIFICATION-FREE: it unions the
# cable and connector masks, so it survives SAM3 labelling the whole assembly "cable" (the failure that
# starves the neck pipeline, since that one iterates over CONNECTOR masks).
#   cable_tip_ros_node.py   -> ~/tips
#   connector_pose_node.py  -> base_link -> connector_tip

# ---- Frames / IK / controller ----
tf_cache_s: 120.0
base_frame: base_link
# tip_frame is the ROBOT'S TOOL FLANGE (the link IK solves for) -- NOT the fingertip, and NOT the
# cable's connector tip. Three different things; see the README.
tip_frame: tool0
camera_frame: camera1_color_optical_frame
planning_group: ur_manipulator
controller_action: /scaled_joint_trajectory_controller/follow_joint_trajectory
ik_timeout_s: 2.0
ik_attempts: 12
avoid_collisions: false

# ---- Connector TIP, from the SAM3 tip pipeline ----
# The inherited scan machinery (including the axis-aware refine orbit) keys off connector_frame, so
# naming the tip frame here makes the scan refine the TIP's axis for free.
connector_frame: connector_tip
connector_max_age_s: 30.0
connector_wait_s: 40.0

# WHERE TO TOUCH, relative to the TIP frame. The tip frame's x is the connector AXIS, pointing OUT of
# the cable toward the tip -- so -x is BACK along the cable from the tip.
touch_offset:
  xyz: [-0.05, 0.0, 0.0]         # 5 cm back along the cable from the tip
  rpy: [0.0, 0.0, 0.0]

# WHERE TO GRASP, relative to the TIP frame. Omit it (or leave it equal to touch_offset) to grasp
# exactly where we touched -- STRONGLY recommended: z is only KNOWN at the touch point, so grasping
# elsewhere re-introduces the height uncertainty the touch just removed.
grasp_offset:
  xyz: [-0.05, 0.0, 0.0]
  rpy: [0.0, 0.0, 0.0]

# ---- Touch probe ----
# The probe is the gripper with the fingers FULLY CLOSED -- no extra hardware. The descent is POSITION
# controlled and the force is checked BEFORE each step, so the overshoot past the trigger is bounded by
# ONE step. Keep step_m small and force_n low: a position-controlled move into a rigid object builds
# force fast. The UR's protective stop is the backstop. KEEP THE E-STOP IN HAND.
touch:
  force_n: 3.0                   # VERY low -- this is a probe, not a push. Raise only if the F/T noise
                                 # floor triggers it spuriously (watch for an instant "contact").
  step_m: 0.001                  # 1 mm per step -> bounds the force overshoot
  max_descent_m: 0.06            # give up (and abort) rather than drive deeper than this
  settle_s: 0.25                 # pause after each step so the wrench reading is steady
  hover_height_m: 0.05           # how far above the connector to align/retract to
  contact_z_offset_m: 0.0        # added to the contact z to get the GRASP z. The probe touches the TOP
                                 # of the connector, so a small NEGATIVE value (e.g. -0.003) drops the
                                 # fingertip to the connector's centre. Tune on the real part.
  tare_before: true              # zero the F/T just before descending (essential: tool weight >> 3 N)
  wrench_topic: /force_torque_sensor_broadcaster/wrench
  ft_zero_service: /io_and_status_controller/zero_ftsensor

# ---- Align (closed-loop, over the touch point, while hovering) ----
# Re-reads the tip pose each iteration, so an estimate that is still improving during the scan is
# tracked rather than committed to once.
align:
  max_iterations: 8
  pos_deadband_m: 0.002
  ang_deadband_deg: 1.5

# ---- Gripper frame / fingertip (kept in step with cable_pick_place.yaml) ----
# grasp_tcp_offset is identity here, so the fingertip is measured straight from tool0.
grasp_tcp_offset:
  xyz: [0.0, 0.0, 0.0]
  rpy: [0.0, 0.0, 0.0]
# The FINGERTIP is this demo's grasp reference AND -- with the fingers shut -- its touch PROBE.
# rpy is EXTRINSIC XYZ (sxyz); = [180, 0, 90] deg in the intrinsic-XYZ convention CAD tools report.
fingertip_grasp:
  xyz: [0.0, -0.01254, 0.18165]
  rpy: [3.14159, 0.0, -1.5708]
publish_fingertip_tf: true       # broadcast tool0 -> fingertip; verify the probe tip in RViz

# ---- Scan phase (inherited; refines the TIP's axis) ----
scan:
  # Detection-gated: hold each view until the detector positively detects a frame captured while
  # STATIONARY there, and keep sweeping until min_good_views are banked (then ABORT if it can't).
  # NOTE the topic: this demo uses the TIP detector, not the neck detector.
  require_detection: true
  min_good_views: 4
  max_passes: 3
  max_dwell_s: 20.0
  view_settle_s: 0.5
  necks_topic: /cable_tip_detector/tips    # <-- the TIP detector's output
  dwell_s: 10.0                            # only used when require_detection is false

  # ---- Progressive approach: move CLOSER after each GOOD view ----
  # Depth error grows as Z^2, so closing from 230 mm to 45 mm cuts it ~26x. It matters LESS here than in
  # the other demos -- this one measures z by TOUCHING anyway -- but it still sharpens the x/y and YAW
  # that the touch CANNOT recover, and those are exactly what this demo depends on vision for.
  approach:
    enabled: true
    step_m: 0.010
    min_distance_m: 0.045
    # Offsets scale with range; tilts do not (each is atan(offset/distance), invariant under
    # proportional scaling), so the view angle stays constant at every range.
    nominal_distance_m: 0.23
    scale_offsets: true

  relative_bounds:
    xyz: [0.08, 0.08, 0.05]
    rpy: [0.35, 0.35, 0.10]
  offsets:
    - {xyz: [ 0.000,  0.000, 0.00], rpy: [ 0.0000,  0.0000, 0.0]}   # start view
    - {xyz: [ 0.040,  0.000, 0.00], rpy: [ 0.0000, -0.1722, 0.0]}
    - {xyz: [ 0.028,  0.028, 0.00], rpy: [ 0.1224, -0.1224, 0.0]}
    - {xyz: [ 0.000,  0.040, 0.00], rpy: [ 0.1722,  0.0000, 0.0]}
    - {xyz: [-0.028,  0.028, 0.00], rpy: [ 0.1224,  0.1224, 0.0]}
    - {xyz: [-0.040,  0.000, 0.00], rpy: [ 0.0000,  0.1722, 0.0]}
    - {xyz: [-0.028, -0.028, 0.00], rpy: [-0.1224,  0.1224, 0.0]}
    - {xyz: [ 0.000, -0.040, 0.00], rpy: [-0.1722,  0.0000, 0.0]}
    - {xyz: [ 0.028, -0.028, 0.00], rpy: [-0.1224, -0.1224, 0.0]}
    - {xyz: [ 0.056,  0.032, 0.00], rpy: [ 0.1404, -0.2400, 0.0]}
    - {xyz: [-0.056,  0.032, 0.00], rpy: [ 0.1404,  0.2400, 0.0]}
    - {xyz: [ 0.000, -0.065, 0.00], rpy: [-0.2754,  0.0000, 0.0]}
  # Orbit about the cable axis: the only motion that sharpens the AXIS (hence the YAW, which this demo
  # depends on). Bounded by an angle so the view cannot skew off the cable.
  refine:
    enabled: true
    orbit_deg: [12.0, -12.0, 20.0, -20.0]
    max_orbit_deg: 25.0
    # MUST be BELOW approach.min_distance_m, or EVERY orbit view is rejected once the camera closes in
    # (at a 45 mm standoff a 20 deg orbit leaves it only 42 mm up -- a 120 mm floor refuses them all).
    min_height_m: 0.030

# ---- Scan overlay output ----
save_scan_images: true
debug_image_topic: /cable_tip_detector/debug_image   # the TIP detector's overlay
data_dir: data
scan_images_subdir: cable_touch_pick_place

# ---- Lift / place ----
approach_distance_m: 0.10
approach_axis: [0.0, 0.0, -1.0]
lift_distance_m: 0.10
lift_axis: [0.0, 0.0, 1.0]
place_offset_xyz: [0.050, 0.0, 0.0]
place_offset_rpy: [0.0, 0.0, 0.0]

# ---- Gripper ----
gripper:
  action: /robotiq_gripper_controller/gripper_cmd
  joint: robotiq_85_left_knuckle_joint
  open_position: 0.0
  closed_position: 0.6
  max_effort: 50.0
  max_velocity: 0.5

# ---- Pick-up failure detection & recovery (inherited) ----
# Also supplies grasp_close = full_close_rad, which is what the fingers are closed to for PROBING.
grasp_check:
  enabled: true
  closed_counts: 228
  tolerance_counts: 1
  full_close_rad: 0.8
  settle_s: 1.0
  max_retries: 2

# ---- Speed (max velocity caps) ----
# Keep these MODEST: the touch descent is a stack of ~60 one-millimetre moves, and min_move_duration_s
# is what actually paces it.
speed:
  max_joint_velocity_rad_s: 0.4
  max_cartesian_velocity_m_s: 0.05
  min_move_duration_s: 0.3

# ---- Timing / safety / debug ----
move_duration_s: 4.0
move_timeout_s: 60.0
settle_s: 0.5
confirm_each_step: true          # STRONGLY recommended: this demo drives the arm into contact
debug: false
