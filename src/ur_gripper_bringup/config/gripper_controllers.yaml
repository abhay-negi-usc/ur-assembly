# Gripper controllers, spawned into the UR driver's controller_manager by
# ur_gripper_control.launch.py (the gripper hardware is loaded from the combined URDF, so it
# lives in the SAME controller_manager as the arm controllers).
#
# 'type' lives in each controller's OWN namespace (the Jazzy spawner reads it from there when
# loading via --param-file). No joint_state_broadcaster -- the UR driver's JSB already covers
# the gripper joint (single combined URDF/CM).

robotiq_gripper_controller:
  ros__parameters:
    type: parallel_gripper_action_controller/GripperActionController
    joint: robotiq_85_left_knuckle_joint
    # This controller REQUIRES both position AND velocity STATE interfaces -- with position
    # only it fails activation with "Expected 1 velocity state interface". The 2F-85 exports
    # both. Command is position-only here (force/speed use the gripper defaults). To set
    # force/speed through the controller, add (the 2F-85 exports them under these names):
    #   max_effort_interface: robotiq_85_left_knuckle_joint/set_gripper_max_effort
    #   max_velocity_interface: robotiq_85_left_knuckle_joint/set_gripper_max_velocity
    max_effort: 50.0
    max_velocity: 0.5
    state_interfaces:
      - position
      - velocity
    allow_stalling: true
    stall_timeout: 0.05
    goal_tolerance: 0.02

robotiq_activation_controller:
  ros__parameters:
    type: robotiq_controllers/RobotiqActivationController
    default: true
