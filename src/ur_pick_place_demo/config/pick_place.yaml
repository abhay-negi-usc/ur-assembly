# Fiducial-guided pick-and-place configuration.
#
# Transform chain:
#   T_base_marker   from tf (base_frame -> marker_frame; needs ur_vision_demo + ur_tf_demo hand-eye)
#   T_base_object = T_base_marker * inv(object_marker)        # object pose in base
#   T_base_grasp  = T_base_object * object_grasp              # grasp-TCP pose in base
#   tool0 target  = T_base_grasp * inv(grasp_tcp_offset)      # IK solves for tip_frame (tool0)
#
# All transforms are xyz (meters) + rpy (radians).

# ---- Frames / motion infra ----
base_frame: base_link
tip_frame: tool0                 # IK link (the arm controls this) -- tool0 matches the pendant TCP
planning_group: ur_manipulator
controller_action: /scaled_joint_trajectory_controller/follow_joint_trajectory
ik_timeout_s: 2.0
ik_attempts: 12                  # retry /compute_ik with random seeds (KDL is a local solver; a
                                 # reachable pose can need a different IK branch than the seed)
avoid_collisions: false          # this demo sets up no planning scene; collision checks here only
                                 # cause spurious -31 failures. Set true only with a real scene.

# ---- Marker / object ----
marker:
  id: 11
  dictionary: DICT_4X4_50        # informational here; detection is done by ur_vision_demo
  size_m: 0.0203                 # informational; the detector uses ur_vision_demo/cameras.yaml
  frame: ""                      # default: camera1_marker_<id>; set to override

# Pose of the MARKER with respect to the OBJECT frame (T_object_marker).
# Default: marker sits 25 cm from the object origin along the object +Z (e.g. on top of it).
object_marker:
  xyz: [0.0, 0.0, 0.0]
  rpy: [0.0, 0.0, 0.0]

# Grasp pose: the grasp-TCP with respect to the OBJECT frame (T_object_grasp).
# rpy [pi, 0, 0] = 180 deg roll about the object X (flips the grasp frame's Z/Y to approach
# from the opposite side).
object_grasp:
  xyz: [0.0, 0.0, -0.0225]
  rpy: [-1.5708, 0.0, 0.0]

# ---- Gripper TCP ----
# The grasp point between the fingers, relative to the tip_frame (tool0). +Z is along the
# gripper approach (out of tool0). SET THIS to your hardware: ~coupler (0.016) + the 2F-85
# length from its base to the fingertip contact (~0.15). Approximate default below.
grasp_tcp_offset:
  xyz: [0.0, 0.0, 0.16]
  rpy: [0.0, 0.0, 0.0]

# ---- Pick approach / retreat ----
approach_distance_m: 0.200        # pre-grasp stand-off
approach_axis: [0.0, 0.0, -1.0]   # in the GRASP frame (+Z = stand off along grasp +Z)
lift_distance_m: 0.10            # lift after grasping
lift_axis: [0.0, 0.0, 1.0]       # in the BASE frame (+Z = straight up)

# ---- Visual approach (steps 1-3): center + square the camera on the marker, then step in ----
# Flow: 1) detect the marker, 2) align+center it in the camera view (face it head-on, no depth
# change), 3) take discrete servo_step_m steps toward it -- re-detecting and re-centering each
# step -- until the camera is servo_standoff_m from the marker. Then the grasp is recomputed from
# that close, accurate view and steps 4-7 (grasp-align -> grasp -> pick/place -> home) run.
#
# NOTE: servo_standoff_m is the CAMERA-to-marker distance at which the visual approach stops.
# approach_distance_m (below) is a separate thing: the grasp-align stand-off from the grasp pose.
camera_frame: camera1_color_optical_frame   # optical frame the marker is detected in
servo_standoff_m: 0.060          # stop the visual approach at this camera->marker distance
servo_step_m: 0.05              # discrete step size toward the marker
# Desired camera orientation expressed in the MARKER frame. [pi, 0, 0] = optical axis facing the
# marker head-on with matching left/right (marker X->cam X, Y->cam -Y, Z->cam -Z). Assumes the
# marker's +Z faces the camera (standard for a marker facing the robot).
servo_cam_rpy_in_marker: [3.14159, 0.0, 0.0]
servo_max_iterations: 20        # safety cap on approach steps

# If the marker leaves the camera view, back off along tool0 -Z and retry:
marker_max_age_s: 60.0           # a marker tf older than this = "not in view" (tf2 caches the last one)
reacquire_timeout_s: 2.0        # wait this long for a fresh marker before retracting
reacquire_retract_m: 0.01       # retract tool0 by this along -Z when the marker isn't visible
reacquire_max_retries: 5        # give up (abort) after this many retract-and-retry attempts

# ---- Reaching the grasp: blind pick vs. closed-loop visual servo ----
# After the visual approach estimates the grasp at the standoff, EITHER:
#   blind_pick: true  -> return to the initial (home) pose, then execute the grasp OPEN-LOOP from
#                        the memorized estimate. The object is assumed static and the marker is NOT
#                        observed again (it's typically occluded by the gripper during the final
#                        approach). Goes to the grasp stand-off (approach_distance_m along
#                        approach_axis) first, then the grasp.
#   blind_pick: false -> closed-loop visual servo: step tool0 toward the grasp-align, then the
#                        grasp, re-reading the marker and correcting each iteration. The final
#                        grasp finishes open-loop if the marker is lost near contact.
blind_pick: true

# Closed-loop visual servo control law (used only when blind_pick is false):
servo_gain: 1.0                  # fraction of the remaining pose error to close each iteration
servo_max_linear_step_m: 0.03   # per-iteration translation clamp (safety)
servo_max_angular_step_deg: 20.0  # per-iteration rotation clamp (safety)
servo_pos_deadband_m: 0.010     # within this position error -> converged (stop servoing)
servo_ang_deadband_deg: 5.0     # within this orientation error -> converged
# (servo_max_iterations above also caps the servo convergence loop.)

# ---- Place = pick pose shifted by this offset (in the BASE frame) ----
place_offset_xyz: [0.0, 0.0, 0.0]    # zero = place at the pick location
place_offset_rpy: [0.0, 0.0, 0.0]

# ---- Gripper ----
gripper:
  action: /robotiq_gripper_controller/gripper_cmd
  joint: robotiq_85_left_knuckle_joint
  open_position: 0.0
  closed_position: 0.8           # tune to the object width
  max_effort: 50.0
  max_velocity: 0.5

# ---- Speed (max velocity caps) ----
# Bound the arm's velocity so each move's duration scales with its size (larger move -> more time),
# which also avoids the joint-velocity-limit protective stops a fixed duration can trigger. Set
# either or both caps; the more restrictive one wins. 0 disables that cap. If BOTH are 0, moves use
# the fixed move_duration_s below. Caps bound the AVERAGE speed of a move (peak ~1.5x) -- set
# conservatively. Override at launch: -p max_joint_velocity:=0.6 -p max_cartesian_velocity:=0.10
speed:
  max_joint_velocity_rad_s: 0.5     # cap on any single joint's speed (rad/s); 0 = off
  max_cartesian_velocity_m_s: 0.10  # cap on tool0 straight-line speed (m/s); 0 = off
  min_move_duration_s: 0.5          # floor so small moves aren't near-instantaneous

# ---- Timing / safety ----
move_duration_s: 4.0             # per arm move (used only if BOTH speed caps above are 0)
move_timeout_s: 60.0             # give up waiting on a trajectory result after this (a goal is
                                 # accepted even if External Control isn't playing / speed=0)
settle_s: 0.5
confirm_each_step: true          # prompt before each motion (recommended on real HW)

# ---- Debug ----
# Print, per arm move, the controlled frame's current/target/delta pose (in base), and during the
# visual approach the marker's pose in the camera frame (x/y = centering error, z = depth).
# Also overridable on the command line: --ros-args -p debug:=true
debug: false
