# ur_tf_demo configuration.
#
# Frames and the per-camera hand-eye extrinsics (base -> camera optical frame). The static
# transforms published from this file are what connect the camera(s) to the robot, so that
# tf2 can compose base -> camera -> marker.

base_frame: base_link          # UR base (robot_state_publisher root). 'base' is the rotated variant.
tool_frame: flange            # controlled frame (matches the pendant); tool0 also available in tf
publish_rate_hz: 10.0

# Marker tf frames are matched by these prefixes (must match ur_vision_demo's
# marker_frame_prefix, i.e. '<camera>_marker_').
marker_frame_prefixes:
  - camera1_marker_

# Hand-eye extrinsics, ONE entry per camera.
#   parent_frame: the frame the camera is rigidly mounted to.
#     - EYE-IN-HAND (camera on the tool): use the tool frame (tool0). The camera moves with the
#       arm, and tf composes base -> tool0 -> camera automatically.
#     - EYE-TO-HAND (fixed/world camera): use base_link instead.
#   xyz (m) / rpy (rad): the parent_frame -> camera_frame transform from calibration.
#
# Values below are from the hand-eye result T_TCP_TO_CAMERA0 (tool0 -> camera): pure
# translation y=-0.080, z=0.031, identity rotation.
# NOTE: calibration named it CAMERA0; our detector publishes 'camera1_color_optical_frame'
# (ur_vision_demo's camera name is 'camera1'). Keep these names consistent.
cameras:
  # Calibration T_TCP_TO_CAMERA0 is expressed w.r.t. the FLANGE frame (the camera's optical axes
  # align with the flange triad the user sees on the pendant), so parent_frame is 'flange' and
  # the calibration values are used as-is (identity rotation). tool0 remains the arm IK/control
  # frame; this only affects the camera branch of the tf tree.
  - parent_frame: flange
    camera_frame: camera1_color_optical_frame
    xyz: [0.0, -0.080, 0.031]
    rpy: [0.0, 0.0, 0.0]
