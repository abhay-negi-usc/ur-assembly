# ur_vision_demo configuration.
#
# Each camera gets its own RealSense node and its own ArUco detector, so multiple cameras
# stream marker poses simultaneously. Fill in serial_no for each (find them with
# `rs-enumerate-devices -s`). With more than one camera, serial_no is REQUIRED -- otherwise
# both nodes may grab the same device. A single camera can leave serial_no empty.

cameras:
  - name: camera1
    serial_no: "218622272137"   # Intel RealSense D405
  # - name: camera2
  #   serial_no: "<second camera serial>"   # uncomment + fill for a 2nd camera

# Fiducial marker settings shared by all cameras.
aruco:
  # Any predefined OpenCV ArUco dictionary, e.g.
  #   DICT_4X4_50 DICT_4X4_100 DICT_5X5_100 DICT_6X6_250 DICT_7X7_1000 DICT_ARUCO_ORIGINAL
  #   DICT_APRILTAG_36h11 (AprilTag families are also exposed through cv2.aruco)
  dictionary: DICT_4X4_50
  # Physical side length of the printed marker's black square, in METERS. Measure your print.
  marker_size_m: 0.05
