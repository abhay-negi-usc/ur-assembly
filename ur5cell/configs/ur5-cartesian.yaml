# Cartesian jog on the UR5 -- nudge tool0 along/about each axis and back, confirming every move:
#
#     python -m urlab.apps.cartesian --config ur5cell/configs/ur5-cartesian.yaml --dry-run
#     python -m urlab.apps.cartesian --config ur5cell/configs/ur5-cartesian.yaml
#
# Speeds are ur5-robot.yaml's bring-up caps (no speed: block here, so they are inherited).
robot_config: ur5-robot.yaml
camera_config: ur5-camera.yaml

linear_step_mm: 20.0
angular_step_deg: 10.0
# ur_base = the pendant's Base axes, tool0 = its Tool axes. (world = ROS base_link, whose x/y are
# the pendant's NEGATED -- the reason this file names ur_base.)
motion_frames: [ur_base, tool0]

move_timeout_s: 60.0
settle_s: 0.5
confirm_each_step: true
debug: false
