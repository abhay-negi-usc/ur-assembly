# THE UR5 MACHINE FILE -- this cell's counterpart of configs/robot.yaml, referenced EXPLICITLY by
# every UR5 config:
#
#     robot_config: ur5-robot.yaml
#
# Same fill rules (urlab/config.py _apply_machine_layers): every top-level block a config does not
# define is copied from here. That is also how `frames_file` reaches every UR5 config -- so none of
# them can silently fall back to the UR10e's configs/frames.yaml (ur5cell/tests checks it).

robot:
  # .125 is where the UR5 ACTUALLY answers (dashboard checked 2026-10-15: serial 2016353713,
  # PolyScope 3.15.8). The intended address was .127, and the pendant's network page did not
  # match what answers -- if the robot is re-addressed, change it here AND in
  # ur5cell/tests/test_ur5_configs.py.
  ip: 192.168.10.125
  # UR5 CB3.1 -- serial 2016353713, built 2016-11-30. CB3 means: no wrist F/T sensor
  # (getActualTCPForce is a joint-current ESTIMATE), no zero_ftsensor (tared in software), no
  # force-mode gain scaling, 125 Hz RTDE. urlab/robot/arm.py switches on this key.
  series: cb3
  model: ur5                     # read by nothing yet; the collision model will key on it
  rtde_frequency_hz: 125.0       # the CB3 maximum, stated rather than left to ur_rtde
  # CONNECTION MODE. false = ur_rtde uploads its own script, exactly as on the UR10e; the External
  # Control URCap must NOT be playing. true = a pendant program's External Control node pulls the
  # script from this PC on ur_cap_port, and an operator has to press Play.
  use_ext_ur_cap: false
  ur_cap_port: 50002
  dry_run: false
  # PAYLOAD -- the spacer + 2F-85 + camera (2026-10-27): CoG 100 mm out along tool0 +z. URArm sends
  # it with setPayload at connect, OVERRIDING the pendant installation's payload -- re-weigh when
  # the stack changes, or every wrench reads the difference as contact.
  payload:
    mass_kg: 1.66
    cog_mm: [0.0, 0.0, 100.0]

# Robotiq 2F-85, Modbus RTU straight from this PC through its USB-RS485 adapter (not via the CB3
# controller). The by-id path survives replugs; /dev/ttyUSB0 numbering does not. A read of the
# status register answered here on 2026-10-20 (activated, fingers open). Building it activates the
# gripper if it is not already -- a full finger stroke.
gripper:
  type: robotiq_2f85
  port: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BG01X8DU-if00-port0
  baud: 115200
  open_counts: 0
  closed_counts: 255
  speed_counts: 255
  force_counts: 150
  timeout_s: 5.0

# The Robot facade's two tool0 frames, NAMED in ur5-frames.yaml rather than copied, so the
# spacer -> gripper chain reaches them with nothing to keep in step (tool_frames.section_pose).
fingertip_grasp:  {frame: fingertip}
grasp_tcp_offset: {frame: grasp}

compute:
  device: auto

base_frame: base_link            # ROS base_link; transforms.py bridges to the UR `base` frame
tip_frame: tool0                 # the pendant all-zeros TCP

frames_file: ur5-frames.yaml     # resolved beside the config, i.e. ur5cell/configs/

# BRING-UP SPEEDS -- deliberately slow; raise them once the cell is known.
speed:
  max_joint_velocity_deg_s: 20.0
  max_joint_acceleration_deg_s2: 30.0
  max_cartesian_translation_mm_s: 50.0
  max_cartesian_rotation_deg_s: 20.0

# NOT SET HERE ON PURPOSE: reset.home_joints_deg. Teach it at bring-up (read the joints off
# urlab.apps.monitor) and add it -- until then urlab.skills.reset falls back to a UR10e pose
# that means nothing on this arm, so do not run a reset.
